cx4: w/2, cy4: pos4 + itemH/2,\n                cx5: w/2, cy5: pos5 + itemH/2,\n                cx6: w/2, cy6: pos6 + itemH/2\n            },\n            \n            /* House Icon (centered and scaled) */\n            \"<g transform='translate(\" & (cx1 - 12*scale) & \",\" & (cy1 - 12*scale) & \") scale(\" & scale & \")'>\" &\n            \"<path d='M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8' fill='none' stroke='\" & If(state = 1, \"#FFFFFF\", \"#4B5563\") & \"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\" &\n            If(state = 1, \"<animate attributeName='stroke' from='#4B5563' to='#FFFFFF' dur='0.3s' fill='freeze'/>\", \"\") &\n            \"</path>\" &\n            \"<path d='M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' fill='none' stroke='\" & If(state = 1, \"#FFFFFF\", \"#4B5563\") & \"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\" &\n            If(state = 1, \"<animate attributeName='stroke' from='#4B5563' to='#FFFFFF' dur='0.3s' fill='freeze'/>\", \"\") &\n            \"</path>\" &\n            \"</g>\" &\n\n            /* Layout-Dashboard Icon (centered and scaled) */\n            \"<g transform='translate(\" & (cx2 - 12*scale) & \",\" & (cy2 - 12*scale) & \") scale(\" & scale & \")'>\" &\n            \"<rect width='7' height='9' x='3' y='3' rx='1' fill='none' stroke='\" & If(state = 2, \"#FFFFFF\", \"#4B5563\") & \"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\" &\n            If(state = 2, \"<animate attributeName='stroke' from='#4B5563' to='#FFFFFF' dur='0.3s' fill='freeze'/>\", \"\") &\n            \"</rect>\" &\n            \"<rect width='7' height='5' x='14' y='3' rx='1' fill='none' stroke='\" & If(state = 2, \"#FFFFFF\", \"#4B5563\") & \"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\" &\n            If(state = 2, \"<animate attributeName='stroke' from='#4B5563' to='#FFFFFF' dur='0.3s' fill='freeze'/>\", \"\") &\n            \"</rect>\" &\n            \"<rect width='7' height='9' x='14' y='12' rx='1' fill='none' stroke='\" & If(state = 2, \"#FFFFFF\", \"#4B5563\") & \"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\" &\n            If(state = 2, \"<animate attributeName='stroke' from='#4B5563' to='#FFFFFF' dur='0.3s' fill='freeze'/>\", \"\") &\n            \"</rect>\" &\n            \"<rect width='7' height='5' x='3' y='16' rx='1' fill='none' stroke='\" & If(state = 2, \"#FFFFFF\", \"#4B5563\") & \"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\" &\n            If(state = 2, \"<animate attributeName='stroke' from='#4B5563' to='#FFFFFF' dur='0.3s' fill='freeze'/>\", \"\") &\n            \"</rect>\" &\n            \"</g>\" &\n\n            /* Chart-Bar Icon (centered and scaled) */\n            \"<g transform='translate(\" & (cx3 - 12*scale) & \",\" & (cy3 - 12*scale) & \") scale(\" & scale & \")'>\" &\n            \"<path d='M3 3v16a2 2 0 0 0 2 2h16' fill='none' stroke='\" & If(state = 3, \"#FFFFFF\", \"#4B5563\") & \"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\" &\n            If(state = 3, \"<animate attributeName='stroke' from='#4B5563' to='#FFFFFF' dur='0.3s' fill='freeze'/>\", \"\") &\n            \"</path>\" &\n            \"<path d='M7 16h8' fill='none' stroke='\" & If(state = 3, \"#FFFFFF\", \"#4B5563\") & \"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\" &\n            If(state = 3, \"<animate attributeName='stroke' from='#4B5563' to='#FFFFFF' dur='0.3s' fill='freeze'/>\", \"\") &\n            \"</path>\" &\n            \"<path d='M7 11h12' fill='none' stroke='\" & If(state = 3, \"#FFFFFF\", \"#4B5563\") & \"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\" &\n            If(state = 3, \"<animate attributeName='stroke' from='#4B5563' to='#FFFFFF' dur='0.3s' fill='freeze'/>\", \"\") &\n            \"</path>\" &\n            \"<path d='M7 6h3' fill='none' st