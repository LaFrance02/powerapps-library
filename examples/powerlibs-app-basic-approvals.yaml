                    =Table(
                        { filterKey: "all", filterLabel: "All" },
                        { filterKey: "pending", filterLabel: "Waiting" },
                        { filterKey: "approved", filterLabel: "Approved" },
                        { filterKey: "rejected", filterLabel: "Rejected" }
