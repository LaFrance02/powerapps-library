Screens:
  ApprovalsMyRequests:
    Properties:
      Fill: =RGBA(11, 18, 32, 1)
      LoadingSpinnerColor: =RGBA(79, 70, 229, 1)
      OnVisible: |-
        =If(IsEmpty(gblApRequests),
            ClearCollect(gblApRequests,
                { Id: 201, Title: "Standing desk", Type: "Purchase", TypeColor: RGBA(168, 85, 247, 1), Requester: "Mara S.", Initials: "MS", Amount: "€680", Reason: "Ergonomic recommendation from the company doctor.", Submitted: "12 Aug", Status: "rejected", Approver: "Lars B.", Decided: "14 Aug", Comment: "Facilities has a pool of desks, ask them first.", Mine: true, ForMe: false },
                { Id: 202, Title: "Three days off before Christmas", Type: "Time off", TypeColor: RGBA(59, 130, 246, 1), Requester: "Mara S.", Initials: "MS", Amount: "", Reason: "22 to 24 December.", Submitted: "20 Aug", Status: "approved", Approver: "Lars B.", Decided: "21 Aug", Comment: "", Mine: true, ForMe: false },
                { Id: 203, Title: "Training: Power Fx advanced", Type: "Expense", TypeColor: RGBA(245, 158, 11, 1), Requester: "Mara S.", Initials: "MS", Amount: "€490", Reason: "Online course, two half days.", Submitted: "26 Aug", Status: "approved", Approver: "Lars B.", Decided: "27 Aug", Comment: "Go for it.", Mine: true, ForMe: false },
                { Id: 204, Title: "Team offsite in Hamburg", Type: "Expense", TypeColor: RGBA(245, 158, 11, 1), Requester: "Elena Rodriguez", Initials: "ER", Amount: "€3,200", Reason: "Two days, eight people, hotel and travel.", Submitted: "28 Aug", Status: "rejected", Approver: "You", Decided: "29 Aug", Comment: "Move it to Q4, the Q3 budget is used up.", Mine: false, ForMe: true },
                { Id: 205, Title: "Cleaning service contract renewal", Type: "Contract", TypeColor: RGBA(236, 72, 153, 1), Requester: "Klaus Müller", Initials: "KM", Amount: "€12,000", Reason: "Same terms as last year, twelve months, cancellable quarterly.", Submitted: "1 Sep", Status: "approved", Approver: "You", Decided: "2 Sep", Comment: "Approved, budget line 4410.", Mine: false, ForMe: true },
                { Id: 206, Title: "Parking spot in the underground garage", Type: "Access", TypeColor: RGBA(20, 184, 166, 1), Requester: "Paul Weber", Initials: "PW", Amount: "", Reason: "From October I commute by car twice a week for the customer visits.", Submitted: "2 Sep", Status: "pending", Approver: "You", Decided: "", Comment: "", Mine: false, ForMe: true },
                { Id: 207, Title: "Home office monitor", Type: "Purchase", TypeColor: RGBA(168, 85, 247, 1), Requester: "Mara S.", Initials: "MS", Amount: "€310", Reason: "27 inch, replaces the 2019 one that flickers.", Submitted: "3 Sep", Status: "pending", Approver: "Lars B.", Decided: "", Comment: "", Mine: true, ForMe: false },
                { Id: 208, Title: "SAP FI read access", Type: "Access", TypeColor: RGBA(20, 184, 166, 1), Requester: "Sarah Chen", Initials: "SC", Amount: "", Reason: "Needed for the month-end reconciliation, read only.", Submitted: "Yesterday", Status: "pending", Approver: "You", Decided: "", Comment: "", Mine: false, ForMe: true },
                { Id: 209, Title: "Conference ticket, Power Platform Summit", Type: "Expense", TypeColor: RGBA(245, 158, 11, 1), Requester: "Tom Becker", Initials: "TB", Amount: "€890", Reason: "Two days in Vienna, talks on Dataverse and Copilot Studio. I will share notes with the team.", Submitted: "Yesterday", Status: "pending", Approver: "You", Decided: "", Comment: "", Mine: false, ForMe: true },
                { Id: 210, Title: "Replacement phone, screen cracked", Type: "Purchase", TypeColor: RGBA(168, 85, 247, 1), Requester: "Nina Hoffmann", Initials: "NH", Amount: "€520", Reason: "Dropped it on the stairs, the display is unusable. Same model as before.", Submitted: "Yesterday", Status: "pending", Approver: "You", Decided: "", Comment: "", Mine: false, ForMe: true },
                { Id: 211, Title: "Laptop for the new hire", Type: "Purchase", TypeColor: RGBA(168, 85, 247, 1), Requester: "Jana Weber", Initials: "JW", Amount: "€1,450", Reason: "Dell Latitude 5450 for Nina, who starts on Monday. Same model as the rest of the team.", Submitted: "Today", Status: "pending", Approver: "You", Decided: "", Comment: "", Mine: false, ForMe: true },
                { Id: 212, Title: "Two weeks vacation in October", Type: "Time off", TypeColor: RGBA(59, 130, 246, 1), Requester: "Marcus Schmidt", Initials: "MS", Amount: "", Reason: "14 to 25 October. Handover to Jana is done and the on-call rota is covered.", Submitted: "Today", Status: "pending", Approver: "You", Decided: "", Comment: "", Mine: false, ForMe: true }
            )
        );
        UpdateContext({ varFilter: "all", varShowNew: false, varShowDetail: false });
        UpdateContext({ varSel: First(Sort(Filter(gblApRequests, Mine), Id, SortOrder.Descending)) })
    Children:
      - arqScreenWidth:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 0, 0, 0)
            Height: =0
            Visible: =false
            Width: =Parent.Width
      - arqRail:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(8, 13, 24, 1)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =52
          Children:
            - arqRailLogo:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(79, 70, 229, 1)
                  Height: =32
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =32
                  X: =10
                  Y: =12
                Children:
                  - arqRailLogoIcon:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =18
                        Icon: =Icon.CheckBadge
                        Width: =18
                        X: =7
                        Y: =7
            - arqRailNavGallery:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Height: =136
                  Items: |-
                    =Table(
                        { railId: 1, railIcon: Icon.DocumentWithContent, railScreen: App.ActiveScreen },
                        { railId: 2, railIcon: Icon.Tray, railScreen: App.ActiveScreen },
                        { railId: 3, railIcon: Icon.Clock, railScreen: App.ActiveScreen }
                    )
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =44
                  Width: =40
                  X: =6
                  Y: =56
                Children:
                  - arqRailItemBg:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(ThisItem.railId = 1, RGBA(255, 255, 255, 0.14), RGBA(0, 0, 0, 0))
                        Height: =36
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =40
                        Y: =2
                  - arqRailItemIcon:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =If(ThisItem.railId = 1, RGBA(255, 255, 255, 1), RGBA(124, 139, 161, 1))
                        Height: =16
                        Icon: =ThisItem.railIcon
                        Width: =16
                        X: =12
                        Y: =12
                  - arqRailItemBtn:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =0
                        Height: =36
                        HoverFill: =RGBA(255, 255, 255, 0.08)
                        OnSelect: |-
                          =If(!IsBlank(ThisItem.railScreen), Navigate(ThisItem.railScreen))
                        PressedFill: =RGBA(255, 255, 255, 0.12)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: =""
                        Width: =40
                        Y: =2
            - arqRailAvatar:
                Control: Circle@2.3.0
                Properties:
                  Fill: =RGBA(51, 65, 85, 1)
                  Height: =32
                  Width: =32
                  X: =10
                  Y: =Parent.Height - 44
            - arqRailAvatarLabel:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =32
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =7
                  Text: ="MS"
                  Width: =32
                  X: =10
                  Y: =Parent.Height - 44
      - arqListPanel:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width - 52 - If(If(arqScreenWidth.Width < 640, 1, arqScreenWidth.Width < 1024, 2, arqScreenWidth.Width < 1600, 3, 4) >= 3, 300, 0)
