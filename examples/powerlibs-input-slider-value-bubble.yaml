- conSliderBubbleCard:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(75, 85, 99, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(31, 41, 55, 1)
      Height: =140
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =360
      X: =40
      Y: =40
    Children:
      - lblSliderBubbleLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(209, 213, 219, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            Text: ="Brightness"
            Width: =Parent.Width - 32
            X: =16
            Y: =16
      - conSliderBubble:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(59, 130, 246, 1)
            Height: =24
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =48
            X: |-
              =sldSliderBubble.X + 9 +
                  (sldSliderBubble.Value - sldSliderBubble.Min) * (sldSliderBubble.Width - 18) /
                  Max(sldSliderBubble.Max - sldSliderBubble.Min, 1) -
                  Self.Width / 2
            Y: =sldSliderBubble.Y - 22
          Children:
            - lblSliderBubbleValue:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.Height
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: =sldSliderBubble.Value & "%"
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - sldSliderBubble:
          Control: Slider
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Default: =40
            FocusedBorderThickness: =0
            HandleActiveFill: =ColorFade(RGBA(59, 130, 246, 1), -20%)
            HandleFill: =RGBA(59, 130, 246, 1)
            HandleHoverFill: =ColorFade(RGBA(59, 130, 246, 1), -10%)
            HandleSize: =18
            Height: =48
            Max: =100
            Min: =0
            RailFill: =RGBA(75, 85, 99, 1)
            RailHoverFill: =RGBA(107, 114, 128, 1)
            ShowValue: =false
            ValueFill: =RGBA(59, 130, 246, 1)
            ValueHoverFill: =ColorFade(RGBA(59, 130, 246, 1), -10%)
            Width: =Parent.Width - 48
            X: =24
            Y: =76
