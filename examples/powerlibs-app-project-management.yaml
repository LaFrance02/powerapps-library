Screens:
  Dashboard:
    Properties:
      LoadingSpinnerColor: =RGBA(79, 70, 229, 1)
      OnVisible: |-
        =Set(gblActiveSidebarId, 1);
        Set(gblMobileSidebarOpen, false)
    Children:
      - mainRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(11, 18, 32, 1)
            Height: =Parent.Height - navRoot.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width - sidebarRoot.Width
            X: =sidebarRoot.Width
            Y: =navRoot.Height
          Children:
            - mainTeamWorkloadCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(21, 30, 48, 1)
                  Height: =Parent.Height - mainProjectsCard.Y - mainProjectsCard.Height - If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) <= 1, 16, 28)
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 14, 8)
                  PaddingLeft: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 20, 14)
                  PaddingRight: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 20, 14)
                  PaddingTop: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 14, 10)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =Parent.Width - If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) <= 1, 16, 32)
                  X: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) <= 1, 8, 16)
                  Y: =mainProjectsCard.Y + mainProjectsCard.Height + 12
                Children:
                  - mainTeamHeaderRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 32, 26)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - mainTeamTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(230, 234, 242, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 14, 11)
                              Text: ="Team Workload"
                        - mainTeamManageBtn:
                            Control: Classic/Button@2.2.0
                            Properties:
                              FocusedBorderThickness: =0
                              Align: =Align.Right
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(79, 70, 229, 1)
                              Fill: =RGBA(0, 0, 0, 0)
                              Font: =Font.'Open Sans'
                              Height: =Parent.Height
                              HoverColor: =ColorFade(RGBA(79, 70, 229, 1), -20%)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 10, 8)
                              Text: ="Manage team →"
                              Width: =100
                  - mainTeamGallery:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        Height: =Parent.Height - mainTeamHeaderRow.Height - 8
                        Items: |
                          =Table(
                              { teamInitials: "MS", teamInitialsBg: RGBA(79, 70, 229, 1), teamName: "Marcus", teamDept: "Warehouse", teamActive: 1, teamDone: 1, teamCapacity: 70, teamCapColor: RGBA(34, 197, 94, 1) },
                              { teamInitials: "ER", teamInitialsBg: RGBA(168, 85, 247, 1), teamName: "Elena", teamDept: "Supply", teamActive: 3, teamDone: 0, teamCapacity: 85, teamCapColor: RGBA(245, 158, 11, 1) },
                              { teamInitials: "TW", teamInitialsBg: RGBA(16, 185, 129, 1), teamName: "Thomas", teamDept: "Continuous", teamActive: 4, teamDone: 0, teamCapacity: 60, teamCapColor: RGBA(34, 197, 94, 1) },
                              { teamInitials: "SC", teamInitialsBg: RGBA(34, 197, 94, 1), teamName: "Sarah", teamDept: "IT", teamActive: 2, teamDone: 1, teamCapacity: 75, teamCapColor: RGBA(34, 197, 94, 1) },
                              { teamInitials: "KM", teamInitialsBg: RGBA(20, 184, 166, 1), teamName: "Klaus", teamDept: "Production", teamActive: 1, teamDone: 1, teamCapacity: 55, teamCapColor: RGBA(34, 197, 94, 1) }
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 8, 4)
                        TemplateSize: |-
                          =Switch(
                              If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4),
                              1, (Self.Width - Self.TemplatePadding * 3) / 2,
                              2, (Self.Width - Self.TemplatePadding * 4) / 3,
                              Max(140, (Self.Width - Self.TemplatePadding * 6) / 5)
                          )
                        Width: =Parent.Width
                      Children:
                        - mainTeamMemberCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(11, 18, 32, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(11, 18, 32, 1)
                              Height: =Parent.TemplateHeight
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =If(mainTeamGallery.TemplateHeight < 100, 2, If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 6, 3))
                              PaddingBottom: =If(mainTeamGallery.TemplateHeight < 100, 4, If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 12, 8))
                              PaddingLeft: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 14, 10)
                              PaddingRight: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 14, 10)
                              PaddingTop: =If(mainTeamGallery.TemplateHeight < 100, 4, If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 12, 8))
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =Parent.TemplateWidth
                            Children:
                              - mainTeamMemberInfoRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =If(mainTeamGallery.TemplateHeight < 100, 26, If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 38, 30))
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - mainTeamMemberAvatar:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =ThisItem.teamInitialsBg
                                          FillPortions: =0
                                          Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 34, 26)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =Self.Height / 2
                                          RadiusBottomRight: =Self.Height / 2
                                          RadiusTopLeft: =Self.Height / 2
                                          RadiusTopRight: =Self.Height / 2
                                          Visible: =mainTeamGallery.TemplateHeight >= 70
                                          Width: =Self.Height
                                        Children:
                                          - mainTeamMemberAvatarLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Center
                                                Color: =RGBA(255, 255, 255, 1)
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Bold
                                                Height: =Parent.Height
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 9, 7)
                                                Text: =ThisItem.teamInitials
                                                Width: =Parent.Width
                                    - mainTeamMemberTextGroup:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =Parent.Height
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Center
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - mainTeamMemberName:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(230, 234, 242, 1)
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 20, 16)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 10, 8)
                                                Text: =ThisItem.teamName
                                                Width: =Parent.Width
                                          - mainTeamMemberDept:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(93, 107, 132, 1)
                                                Font: =Font.'Open Sans'
                                                Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 16, 14)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 8, 7)
                                                Text: =ThisItem.teamDept
                                                Visible: =mainTeamGallery.TemplateHeight >= 100
                                                Width: =Parent.Width
                              - mainTeamMemberStatsRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =If(mainTeamGallery.TemplateHeight < 100, 0, 40)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =mainTeamGallery.TemplateHeight >= 100
                                    Width: =Parent.Width
                                  Children:
                                    - mainTeamMemberActiveGroup:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =Parent.Height
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Center
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - mainTeamMemberActiveValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Center
                                                Color: =RGBA(230, 234, 242, 1)
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Bold
                                                Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 24, 18)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 14, 10)
                                                Text: =Text(ThisItem.teamActive)
                                                Width: =Parent.Width
                                          - mainTeamMemberActiveLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Center
                                                Color: =RGBA(93, 107, 132, 1)
                                                Font: =Font.'Open Sans'
                                                Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 16, 14)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 8, 7)
                                                Text: ="Active"
                                                Width: =Parent.Width
                                    - mainTeamMemberDoneGroup:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =Parent.Height
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Center
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - mainTeamMemberDoneValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Center
                                                Color: =RGBA(34, 197, 94, 1)
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Bold
                                                Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 24, 18)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 14, 10)
                                                Text: =Text(ThisItem.teamDone)
                                                Width: =Parent.Width
                                          - mainTeamMemberDoneLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Center
                                                Color: =RGBA(93, 107, 132, 1)
                                                Font: =Font.'Open Sans'
                                                Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 16, 14)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 8, 7)
                                                Text: ="Done"
                                                Width: =Parent.Width
                              - mainTeamMemberCapRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 28, 24)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =3
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - mainTeamMemberCapHeaderRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 16, 14)
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.Width
                                        Children:
                                          - mainTeamMemberCapLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =RGBA(93, 107, 132, 1)
                                                FillPortions: =1
                                                Font: =Font.'Open Sans'
                                                Height: =Parent.Height
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 8, 7)
                                                Text: ="Capacity"
                                          - mainTeamMemberCapPercent:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Right
                                                Color: =RGBA(200, 208, 222, 1)
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =Parent.Height
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 8, 7)
                                                Text: =ThisItem.teamCapacity & "%"
                                                Width: =40
                                    - mainTeamMemberCapBarTrack:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(34, 48, 74, 1)
                                          Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 6, 4)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =3
                                          RadiusBottomRight: =3
                                          RadiusTopLeft: =3
                                          RadiusTopRight: =3
                                          Width: =Parent.Width
                                        Children:
                                          - mainTeamMemberCapBarFill:
                                              Control: GroupContainer@1.5.0
                                              Variant: ManualLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =ThisItem.teamCapColor
                                                Height: =Parent.Height
                                                RadiusBottomLeft: =3
                                                RadiusBottomRight: =3
                                                RadiusTopLeft: =3
                                                RadiusTopRight: =3
                                                Width: =Parent.Width * ThisItem.teamCapacity / 100
            - mainActivityCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(21, 30, 48, 1)
                  Height: =mainProjectsCard.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 14, 8)
                  PaddingLeft: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 20, 14)
                  PaddingRight: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 20, 14)
                  PaddingTop: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 14, 10)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Visible: =If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 3
                  Width: =Parent.Width - mainProjectsCard.Width - mainProjectsCard.X - 16 - If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) <= 1, 8, 16)
                  X: =mainProjectsCard.X + mainProjectsCard.Width + 16
                  Y: =mainProjectsCard.Y
                Children:
                  - mainActivityHeader:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(230, 234, 242, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =If(mainRoot.Height < 600, 26, 32)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 14, 11)
                        Text: ="Activity Feed"
                        Width: =Parent.Width
                  - mainActivityGallery:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Height: =Parent.Height - mainActivityHeader.Height
                        Items: |
                          =Table(
                              {
                                  actInitials: "KM",
                                  actInitialsBg: RGBA(20, 184, 166, 1),
                                  actUser: "Klaus Müller",
                                  actAction: "completed task",
                                  actTarget: "Install robotic welding cell",
                                  actProject: "New Production Line Setup",
                                  actTime: "2 hours ago"
                              },
                              {
                                  actInitials: "ER",
                                  actInitialsBg: RGBA(168, 85, 247, 1),
                                  actUser: "Elena Rodriguez",
                                  actAction: "uploaded file to",
                                  actTarget: "Onboard Tier 1 suppliers",
                                  actProject: "Supplier Portal Implementation",
                                  actTime: "3 hours ago"
                              },
                              {
                                  actInitials: "TW",
                                  actInitialsBg: RGBA(59, 130, 246, 1),
                                  actUser: "Thomas Weber",
                                  actAction: "completed subtask",
                                  actTarget: "Install light modules",
                                  actProject: "Warehouse Automation Upgrade",
                                  actTime: "4 hours ago"
                              },
                              {
                                  actInitials: "SC",
                                  actInitialsBg: RGBA(34, 197, 94, 1),
                                  actUser: "Sarah Chen",
                                  actAction: "commented on",
                                  actTarget: "Complete current state process mapping",
                                  actProject: "ERP System Migration",
                                  actTime: "5 hours ago"
                              },
                              {
                                  actInitials: "MS",
                                  actInitialsBg: RGBA(79, 70, 229, 1),
                                  actUser: "Marcus Schmidt",
                                  actAction: "moved task to In Progress",
                                  actTarget: "Configure WMS pick path optimization",
                                  actProject: "Warehouse Automation Upgrade",
                                  actTime: "1 day ago"
                              },
                              {
                                  actInitials: "KM",
                                  actInitialsBg: RGBA(20, 184, 166, 1),
                                  actUser: "Klaus Müller",
                                  actAction: "logged 8 hours on",
                                  actTarget: "Program welding sequences",
                                  actProject: "New Production Line Setup",
                                  actTime: "1 day ago"
                              }
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =2
                        TemplateSize: =(Self.Height - Self.TemplatePadding * 7) / 6
                        Width: =Parent.Width
                      Children:
                        - mainActivityItemRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 12, 8)
                              PaddingBottom: =If(Parent.TemplateHeight < 45, 2, 4)
                              PaddingTop: =If(Parent.TemplateHeight < 45, 2, 4)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.TemplateWidth
                            Children:
                              - mainActivityAvatar:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =ThisItem.actInitialsBg
                                    FillPortions: =0
                                    Height: =If(If(navRoot.Width < 640, 1, navRoot.Width < 1024, 2, navRoot.Width < 1600, 3, 4) >= 4, 34, 28)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =Self.Height / 2
                                    RadiusBottomRight: =Self.Height / 2
                                    RadiusTopLeft: =Self.Height / 2
                                    RadiusTopRight: =Self.Height / 2
                                    Visible: =mainActivityGallery.TemplateHeight >= 40
                                    Width: =Self.Height
                                  Children:
