- conActionBar:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(21, 30, 48, 1)
      Height: =72
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Width: =Parent.Width
      X: =0
      Y: =Parent.Height - 72
    Children:
      - conActionBarLine:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(34, 48, 74, 1)
            Height: =1
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            X: =0
            Y: =0
      - lblActionBarHint:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =Parent.Height
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =13
            Text: ="You have unsaved changes"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =Parent.Width - 320
            X: =24
            Y: =0
      - btnActionBarSecondary:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Outline
            Height: =40
            OnSelect: |-
              =// For example ResetForm(frmEdit); Back()
              false
            Text: ="Cancel"
            Width: =97
            X: =Parent.Width - 24 - 80 - 12 - Self.Width
            Y: =16
      - btnActionBarPrimary:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Primary
            BasePaletteColor: =RGBA(59, 130, 246, 1)
            Height: =40
            OnSelect: |-
              =// For example SubmitForm(frmEdit)
              false
            Text: ="Save"
            Width: =80
            X: =Parent.Width - 24 - Self.Width
            Y: =16
