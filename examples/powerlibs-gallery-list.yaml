- conList:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(34, 48, 74, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(21, 30, 48, 1)
      Height: =Parent.Height - 80
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =Parent.Width - 80
      X: =40
      Y: =40
    Children:
      - galListRows:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Height: =Parent.Height - Self.Y - 8
            Items: |-
              =Filter(
                  Table(
                      {name:"Max Mustermann", subtitle:"Finance, Zurich", status:"Active"},
                      {name:"Erika Mustermann", subtitle:"IT Support, Bern", status:"Away"},
                      {name:"Jane Doe", subtitle:"Operations, Basel", status:"Active"},
                      {name:"Mario Rossi", subtitle:"Sales, Lugano", status:"Offline"},
                      {name:"Anna Muster", subtitle:"HR, Geneva", status:"Active"},
                      {name:"Jan Jansen", subtitle:"Logistics, Basel", status:"Pending"}
                  ),
                  txtListSearch.Value in name || txtListSearch.Value in subtitle
              )
            ShowScrollbar: =false
            TemplatePadding: =0
            TemplateSize: =64
            Width: =Parent.Width
            X: =0
            Y: =104
          Children:
            - conListRowActive:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =If(ThisItem.IsSelected, RGBA(59, 130, 246, 0.06), RGBA(0, 0, 0, 0))
                  Height: =64
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
            - conListRowAvatar:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(59, 130, 246, 0.12)
                  Height: =36
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =36
                  X: =16
                  Y: =14
                Children:
                  - lblListRowAvatarInitials:
                      Control: Text@0.0.51
                      Properties:
                        Align: ='TextCanvas.Align'.Center
                        FontColor: =RGBA(59, 130, 246, 1)
                        Height: =Parent.Height
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =Upper(Left(ThisItem.name, 1) & Mid(ThisItem.name, Find(" ", ThisItem.name & " ") + 1, 1))
                        VerticalAlign: =VerticalAlign.Middle
                        Weight: ='TextCanvas.Weight'.Bold
                        Width: =Parent.Width
                        X: =0
                        Y: =0
            - lblListRowName:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Start
                  FontColor: =RGBA(230, 234, 242, 1)
                  Height: =21
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  Text: =ThisItem.name
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Semibold
                  Width: =Parent.TemplateWidth - 208
                  X: =68
                  Y: =12
            - lblListRowSub:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Start
                  FontColor: =RGBA(139, 153, 176, 1)
                  Height: =20
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.subtitle
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: =Parent.TemplateWidth - 208
                  X: =68
                  Y: =32
            - conListRowStatus:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =If(ThisItem.status in ["Active", "Done", "Completed", "Approved", "Paid", "Online", "Closed", "Passed"], RGBA(34, 197, 94, 0.14), ThisItem.status in ["Away", "Pending", "Waiting", "In Progress", "In Review", "Review", "On Hold", "Draft", "Busy"], RGBA(245, 158, 11, 0.16), ThisItem.status in ["Blocked", "Offline", "Rejected", "Overdue", "Failed", "Cancelled", "Urgent"], RGBA(239, 68, 68, 0.14), RGBA(59, 130, 246, 0.12))
                  Height: =22
                  RadiusBottomLeft: =11
                  RadiusBottomRight: =11
                  RadiusTopLeft: =11
                  RadiusTopRight: =11
                  Width: =84
                  X: =Parent.TemplateWidth - 128
                  Y: =21
                Children:
                  - lblListRowStatusText:
                      Control: Text@0.0.51
                      Properties:
                        Align: ='TextCanvas.Align'.Center
                        FontColor: =If(ThisItem.status in ["Active", "Done", "Completed", "Approved", "Paid", "Online", "Closed", "Passed"], RGBA(34, 197, 94, 1), ThisItem.status in ["Away", "Pending", "Waiting", "In Progress", "In Review", "Review", "On Hold", "Draft", "Busy"], RGBA(245, 158, 11, 1), ThisItem.status in ["Blocked", "Offline", "Rejected", "Overdue", "Failed", "Cancelled", "Urgent"], RGBA(239, 68, 68, 1), RGBA(59, 130, 246, 1))
                        Height: =Parent.Height
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: =ThisItem.status
                        VerticalAlign: =VerticalAlign.Middle
                        Weight: ='TextCanvas.Weight'.Semibold
                        Width: =Parent.Width
                        X: =0
                        Y: =0
            - imgListRowChevron:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Height: =16
                  Image: |-
                    ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#5d6b84" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m9 18 6-6-6-6'/></svg>")
                  ImagePosition: =ImagePosition.Fit
                  Width: =16
                  X: =Parent.TemplateWidth - 36 + 2
                  Y: =24
            - conListRowLine:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(34, 48, 74, 1)
                  Height: =1
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.TemplateWidth - 32
                  X: =16
                  Y: =63
            - btnListRow:
                Control: Button@0.0.45
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Subtle
                  BasePaletteColor: =RGBA(59, 130, 246, 1)
                  Height: =64
                  OnSelect: =Select(Parent); Set(gblListRow, ThisItem)
                  Text: =""
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
      - lblListEmpty:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Center
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =40
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =13
            Text: ="Nothing matches your search"
            VerticalAlign: =VerticalAlign.Middle
            Visible: =CountRows(galListRows.AllItems) = 0
            Weight: ='TextCanvas.Weight'.Regular
            Width: =Parent.Width
            X: =0
            Y: =128
      - txtListSearch:
          Control: TextInput@0.0.54
          Properties:
            BorderColor: =RGBA(60, 75, 105, 1)
            BorderThickness: =1
            Fill: =RGBA(21, 30, 48, 1)
            Font: =Font.'Open Sans'
            Height: =36
            Placeholder: ="Search..."
            Width: =Parent.Width - 32
            X: =16
            Y: =60
      - lblListTitle:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =36
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =19
            Text: ="People"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Bold
            Width: =Parent.Width - 136
            X: =16
            Y: =16
      - lblListCount:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.End
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =36
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: =CountRows(galListRows.AllItems) & " of 6"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =120
            X: =Parent.Width - 136
            Y: =16
