      Fill: =RGBA(21, 30, 48, 1)
      Height: =181
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Visible: =varShowDropdownMenu
      Width: =btnDropdownMenu.Width
      X: =btnDropdownMenu.X
      Y: =btnDropdownMenu.Y + btnDropdownMenu.Height + 4
    Children:
      - btnDropdownMenuItem1:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Subtle
            BasePaletteColor: =RGBA(230, 234, 242, 1)
            Height: =40
            OnSelect: |-
              =UpdateContext({ varShowDropdownMenu: false })
            Text: =""
            Width: =Parent.Width - 12
            X: =6
            Y: =6
      - lblDropdownMenuItem1Text:
          Control: Text@0.0.51
