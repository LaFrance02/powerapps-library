- btnDropdownMenu:
    Control: Button@0.0.45
    Properties:
      Appearance: ='ButtonCanvas.Appearance'.Secondary
      Height: =40
      OnSelect: |-
        =UpdateContext({ varShowDropdownMenu: !varShowDropdownMenu })
      Text: ="Actions"
      Width: =240
      X: =40
      Y: =40
- icoDropdownMenuChevron:
    Control: Classic/Icon@2.5.0
    Properties:
      Color: =RGBA(139, 153, 176, 1)
      FocusedBorderThickness: =0
      Height: =20
      Icon: =If(varShowDropdownMenu, Icon.ChevronUp, Icon.ChevronDown)
      OnSelect: =Select(btnDropdownMenu)
      PaddingBottom: =3
      PaddingLeft: =3
      PaddingRight: =3
      PaddingTop: =3
      Width: =20
      X: =btnDropdownMenu.X + btnDropdownMenu.Width - 30
      Y: =btnDropdownMenu.Y + 10
- btnDropdownMenuScrim:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      BorderStyle: =BorderStyle.None
      BorderThickness: =0
      Color: =RGBA(0, 0, 0, 0)
      Fill: =RGBA(0, 0, 0, 0)
      FocusedBorderThickness: =0
      Height: =Parent.Height
      HoverBorderColor: =RGBA(0, 0, 0, 0)
      HoverColor: =RGBA(0, 0, 0, 0)
      HoverFill: =RGBA(0, 0, 0, 0)
      OnSelect: |-
        =UpdateContext({ varShowDropdownMenu: false })
      PressedBorderColor: =RGBA(0, 0, 0, 0)
      PressedColor: =RGBA(0, 0, 0, 0)
      PressedFill: =RGBA(0, 0, 0, 0)
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Text: =""
      Visible: =varShowDropdownMenu
      Width: =Parent.Width
      X: =0
      Y: =0
- conDropdownMenu:
