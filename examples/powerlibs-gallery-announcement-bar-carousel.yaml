- conAnnouncementBar:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(55, 65, 81, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(31, 41, 55, 1)
      Height: =48
      Width: =Parent.Width
      X: =0
      Y: =0
    Children:
      - recAnnouncementBarStrip:
          Control: Rectangle@2.3.0
          Properties:
            BorderStyle: =BorderStyle.None
            Fill: =Switch(Coalesce(varAnnouncementIndex, 1), 1, ColorValue("#3B82F6"), 2, ColorValue("#F59E0B"), 3, ColorValue("#10B981"))
            Height: =Parent.Height
            Width: =4
            X: =0
            Y: =0
      - conAnnouncementChip:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Switch(Coalesce(varAnnouncementIndex, 1), 1, ColorValue("#3B82F6"), 2, ColorValue("#F59E0B"), 3, ColorValue("#10B981"))
            Height: =22
            RadiusBottomLeft: =11
            RadiusBottomRight: =11
            RadiusTopLeft: =11
            RadiusTopRight: =11
            Width: =104
            X: =16
            Y: =13
          Children:
            - lblAnnouncementChipText:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.Height
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =8
                  Text: |-
                    =Switch(Coalesce(varAnnouncementIndex, 1), 1, "Notice", 2, "Maintenance", 3, "New")
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - lblAnnouncementMessage:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(243, 244, 246, 1)
            Font: =Font.'Open Sans'
            Height: =Parent.Height
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            Text: |-
              =Switch(Coalesce(varAnnouncementIndex, 1), 1, "New expense policy takes effect September 1. Review it before your next claim.", 2, "Maintenance window this Friday 18.00 to 20.00. The app will be read-only.", 3, "Document upload is live. Attach PDFs directly to your reports.")
            Width: =Parent.Width - 340
            X: =134
            Y: =0
      - lblAnnouncementCounter:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =Parent.Height
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =8
            Text: =Text(Coalesce(varAnnouncementIndex, 1)) & " / " & 3
            Width: =44
            X: =Parent.Width - 196
            Y: =0
      - icoAnnouncementPrev:
          Control: Classic/Icon@2.5.0
          Properties:
            FocusedBorderThickness: =0
            Color: =RGBA(156, 163, 175, 1)
            Height: =24
            Icon: =Icon.ChevronLeft
            OnSelect: =Set(varAnnouncementIndex, Mod(Coalesce(varAnnouncementIndex, 1) + 1, 3) + 1)
            Width: =24
            X: =Parent.Width - 140
            Y: =12
      - icoAnnouncementNext:
          Control: Classic/Icon@2.5.0
          Properties:
            FocusedBorderThickness: =0
            Color: =RGBA(156, 163, 175, 1)
            Height: =24
            Icon: =Icon.ChevronRight
            OnSelect: =Set(varAnnouncementIndex, Mod(Coalesce(varAnnouncementIndex, 1), 3) + 1)
            Width: =24
            X: =Parent.Width - 112
            Y: =12
      - btnAnnouncementPause:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =RGBA(156, 163, 175, 1)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            Height: =22
            HoverColor: =RGBA(243, 244, 246, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: =Set(varAnnouncementPaused, !varAnnouncementPaused)
            PressedColor: =RGBA(243, 244, 246, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =8
            Text: =If(varAnnouncementPaused, "Play", "Pause")
            Width: =60
            X: =Parent.Width - 78
            Y: =13
      - tmrAnnouncementBar:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =5000
            Height: =40
            OnTimerEnd: |-
              =If(!varAnnouncementPaused,
                  Set(varAnnouncementIndex, Mod(Coalesce(varAnnouncementIndex, 1), 3) + 1)
              )
            Repeat: =true
            Visible: =false
            Width: =120
            X: =20
            Y: =4
