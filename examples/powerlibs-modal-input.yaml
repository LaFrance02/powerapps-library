- btnInputTrigger:
    Control: Button@0.0.45
    Properties:
      Appearance: ='ButtonCanvas.Appearance'.Primary
      BasePaletteColor: =RGBA(59, 130, 246, 1)
      Height: =40
      OnSelect: |-
        =UpdateContext({ varShowInput: true })
      Text: ="Add note"
      Width: =160
      X: =40
      Y: =40
- btnInputScrim:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      BorderStyle: =BorderStyle.None
      BorderThickness: =0
      Color: =RGBA(0, 0, 0, 0)
      Fill: =RGBA(11, 18, 32, 0.45)
      FocusedBorderThickness: =0
      Height: =Parent.Height
      HoverBorderColor: =RGBA(0, 0, 0, 0)
      HoverColor: =RGBA(0, 0, 0, 0)
      HoverFill: =RGBA(11, 18, 32, 0.45)
      OnSelect: |-
        =UpdateContext({ varShowInput: false })
      PressedBorderColor: =RGBA(0, 0, 0, 0)
      PressedColor: =RGBA(0, 0, 0, 0)
      PressedFill: =RGBA(11, 18, 32, 0.45)
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Text: =""
      Tooltip: ="Close"
      Visible: =varShowInput
      Width: =Parent.Width
      X: =0
      Y: =0
- conInputPanel:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(21, 30, 48, 1)
      Height: =btnInputSubmit.Y + btnInputSubmit.Height + 24
      RadiusBottomLeft: =14
      RadiusBottomRight: =14
      RadiusTopLeft: =14
      RadiusTopRight: =14
      Visible: =varShowInput
      Width: =Min(460, Parent.Width - 40)
      X: =(Parent.Width - Self.Width) / 2
      Y: =(Parent.Height - Self.Height) / 2
    Children:
      - lblInputTitle:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =32
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =20
            Text: ="Add a note"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Bold
            Width: =Parent.Width - 48
            X: =24
            Y: =24
      - lblInputDescription:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            AutoHeight: =true
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =21
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =13
            Text: ="The note is added to the ticket and the requester sees it."
            VerticalAlign: =VerticalAlign.Top
            Weight: ='TextCanvas.Weight'.Regular
            Width: =Parent.Width - 48
            X: =24
            Y: =lblInputTitle.Y + lblInputTitle.Height + 6
      - txtInputText:
          Control: TextInput@0.0.54
          Properties:
            BorderColor: =RGBA(60, 75, 105, 1)
            BorderThickness: =1
            Fill: =RGBA(21, 30, 48, 1)
            Font: =Font.'Open Sans'
            Height: =110
            Mode: ='TextInputCanvas.Mode'.Multiline
            Placeholder: ="Type your note..."
            Value: =""
            Width: =Parent.Width - 48
            X: =24
            Y: =lblInputDescription.Y + lblInputDescription.Height + 16
      - btnInputCancel:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Outline
            Height: =44
            OnSelect: |-
              =Reset(txtInputText); UpdateContext({ varShowInput: false })
            Text: ="Cancel"
            Width: =(Parent.Width - 48 - 12) / 2
            X: =24
            Y: =txtInputText.Y + txtInputText.Height + 24
      - btnInputSubmit:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Primary
            BasePaletteColor: =RGBA(59, 130, 246, 1)
            Height: =44
            OnSelect: |-
              =UpdateContext({ varInputModalValue: txtInputText.Value });
              // varInputModalValue now holds the text, for example Patch(Notes, Defaults(Notes), { Body: varInputModalValue })
              Reset(txtInputText); UpdateContext({ varShowInput: false })
            Text: ="Add note"
            Width: =(Parent.Width - 48 - 12) / 2
            X: =btnInputCancel.X + btnInputCancel.Width + 12
            Y: =txtInputText.Y + txtInputText.Height + 24
      - imgInputClose:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            FocusedBorderThickness: =0
            Height: =14
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#8b99b0" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18 6 6 18 M6 6l12 12'/></svg>")
            ImagePosition: =ImagePosition.Fit
            OnSelect: |-
              =UpdateContext({ varShowInput: false })
            Width: =14
            X: =Parent.Width - 44 + 9
            Y: =21
