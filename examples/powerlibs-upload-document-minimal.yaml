- conDocumentUploadMinimal:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(75, 85, 99, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(17, 24, 39, 1)
      Height: =260
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =360
      X: =40
      Y: =40
    Children:
      - lblDocumentUploadMinimalCaption:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(209, 213, 219, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            Text: ="Add documents"
            Width: =Parent.Width - 24
            X: =12
            Y: =26
      - lblDocumentUploadMinimalHint:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =18
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =8
            Text: ="Drag files here or click Attach file"
            Width: =Parent.Width - 24
            X: =12
            Y: =48
      - attDocumentUploadMinimalPicker:
          Control: Attachments@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =RGBA(59, 130, 246, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            Height: =Parent.Height - 96
            HoverFill: =RGBA(255, 255, 255, 0.05)
            ItemColor: =RGBA(255, 255, 255, 1)
            ItemFill: =RGBA(55, 65, 81, 1)
            ItemHoverColor: =RGBA(255, 255, 255, 1)
            ItemHoverFill: =RGBA(75, 85, 99, 1)
            MaxAttachments: =10
            PaddingBottom: =5
            PaddingLeft: =5
            PaddingRight: =5
            PaddingTop: =5
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(75, 85, 99, 1)
            Size: =10
            Width: =Parent.Width - 32
            X: =16
            Y: =80
