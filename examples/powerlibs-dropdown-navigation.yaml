- btnNavMenu:
    Control: Button@0.0.45
    Properties:
      Appearance: ='ButtonCanvas.Appearance'.Secondary
      Height: =40
      OnSelect: |-
        =UpdateContext({ varShowNavMenu: !varShowNavMenu })
      Text: =Coalesce(varNavChoice, "Go to")
      Width: =240
      X: =40
      Y: =40
- imgNavMenuIcon:
    Control: Image@2.2.3
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      BorderStyle: =BorderStyle.None
      BorderThickness: =0
      FocusedBorderThickness: =0
      Height: =16
      Image: |-
        ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#8b99b0" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 3h7v7H3z M14 3h7v7h-7z M14 14h7v7h-7z M3 14h7v7H3z'/></svg>")
      ImagePosition: =ImagePosition.Fit
      OnSelect: =Select(btnNavMenu)
      Width: =16
      X: =btnNavMenu.X + 12 + 2
      Y: =btnNavMenu.Y + 10 + 2
- icoNavMenuChevron:
    Control: Classic/Icon@2.5.0
    Properties:
      Color: =RGBA(139, 153, 176, 1)
      FocusedBorderThickness: =0
      Height: =20
      Icon: =If(varShowNavMenu, Icon.ChevronUp, Icon.ChevronDown)
      OnSelect: =Select(btnNavMenu)
      PaddingBottom: =3
      PaddingLeft: =3
      PaddingRight: =3
      PaddingTop: =3
      Width: =20
      X: =btnNavMenu.X + btnNavMenu.Width - 30
      Y: =btnNavMenu.Y + 10
- btnNavMenuScrim:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      BorderStyle: =BorderStyle.None
      BorderThickness: =0
      Color: =RGBA(0, 0, 0, 0)
      Fill: =RGBA(0, 0, 0, 0)
      FocusedBorderThickness: =0
      Height: =Parent.Height
      HoverBorderColor: =RGBA(0, 0, 0, 0)
      HoverColor: =RGBA(0, 0, 0, 0)
      HoverFill: =RGBA(0, 0, 0, 0)
      OnSelect: |-
        =UpdateContext({ varShowNavMenu: false })
      PressedBorderColor: =RGBA(0, 0, 0, 0)
      PressedColor: =RGBA(0, 0, 0, 0)
      PressedFill: =RGBA(0, 0, 0, 0)
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Text: =""
      Visible: =varShowNavMenu
      Width: =Parent.Width
      X: =0
      Y: =0
- conNavMenu:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(34, 48, 74, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.Light
      Fill: =RGBA(21, 30, 48, 1)
      Height: =172
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Visible: =varShowNavMenu
      Width: =btnNavMenu.Width
      X: =btnNavMenu.X
      Y: =btnNavMenu.Y + btnNavMenu.Height + 4
    Children:
      - btnNavMenuItem1:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Subtle
            BasePaletteColor: =RGBA(230, 234, 242, 1)
            Height: =40
            OnSelect: |-
              =UpdateContext({ varNavChoice: "Dashboard", varShowNavMenu: false })
              // Navigate(DashboardScreen)
            Text: =""
            Width: =Parent.Width - 12
            X: =6
            Y: =6
      - lblNavMenuItem1Text:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =40
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =15
            Text: ="Dashboard"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =Parent.Width - 60
            X: =40
            Y: =6
      - imgNavMenuItem1Icon:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            FocusedBorderThickness: =0
            Height: =16
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#8b99b0" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'/></svg>")
            ImagePosition: =ImagePosition.Fit
            OnSelect: =Select(btnNavMenuItem1)
            Width: =16
            X: =18
            Y: =18
