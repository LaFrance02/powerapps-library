          Children:
            - conCheck3Box:
                Control: GroupContainer@1.4.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =If(varCheckCount >= 3, RGBA(34, 197, 94, 1), RGBA(75, 85, 99, 1))
                  Height: =24
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Width: =24
