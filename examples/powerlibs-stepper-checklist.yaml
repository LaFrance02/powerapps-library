- conChecklistSection:
    Control: GroupContainer@1.4.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(30, 41, 56, 1)
      FillPortions: =0
      Height: =380
      LayoutMinHeight: =0
      LayoutMinWidth: =0
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =Parent.Width - 80
    Children:
      - lblCheckTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(243, 244, 246, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="Checklist Progress"
            Width: =300
            X: =20
            Y: =16
      - lblCheckPercent:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(59, 130, 246, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =10
            Text: =Min(varCheckCount, 5) & " / 5 tasks"
            X: =Parent.Width - 170
            Y: =16
      - conCheckTrack:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(75, 85, 99, 1)
            Height: =8
            Width: =Parent.Width - 40
            X: =20
            Y: =52
      - conCheckFill:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =If(varCheckCount >= 5, RGBA(34, 197, 94, 1), RGBA(59, 130, 246, 1))
            Height: =8
            Width: =Max(0, (Parent.Width - 40) * Min(varCheckCount, 5) / 5)
            X: =20
            Y: =52
      - conCheck1:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =40
            Width: =Parent.Width - 40
            X: =20
            Y: =74
          Children:
            - conCheck1Box:
                Control: GroupContainer@1.4.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =If(varCheckCount >= 1, RGBA(34, 197, 94, 1), RGBA(75, 85, 99, 1))
                  Height: =24
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Width: =24
                  Y: =8
                Children:
                  - lblCheck1Mark:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =Parent.Height
                        Size: =9
                        Text: =If(varCheckCount >= 1, "✓", "")
                        Width: =Parent.Width
            - lblCheck1Text:
                Control: Label@2.5.1
                Properties:
                  Color: =If(varCheckCount >= 1, RGBA(156, 163, 175, 1), RGBA(243, 244, 246, 1))
                  Font: =Font.'Open Sans'
                  Height: =24
                  Size: =10
                  Text: ="Create project repository"
                  Width: =Parent.Width - 40
                  X: =34
                  Y: =8
      - conCheck2:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =40
            Width: =Parent.Width - 40
