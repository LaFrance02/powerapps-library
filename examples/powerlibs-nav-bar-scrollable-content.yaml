- conNavbar:
    Control: GroupContainer@1.4.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(30, 41, 56, 1)
      Height: =50
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Width: =Parent.Width
    Children:
      - imgLogo:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(59, 130, 246, 1)
            Height: =50
            Width: =40
            X: =14
      - lblTitle:
          Control: Text@0.0.51
          Properties:
            Height: =50
            Size: =12
            Text: ="Project Name"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Semibold
            Width: =200
            X: =64
      - imgUserProfilePicture:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="User Profile Picture"
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =1
            Height: =35
            Image: =User().Image
            ImagePosition: =ImagePosition.Fill
            RadiusBottomLeft: =25
            RadiusBottomRight: =25
            RadiusTopLeft: =25
            RadiusTopRight: =25
            Width: =35
            X: =Parent.Width - Self.Width - 15
            Y: =7
- conParentScreen:
    Control: GroupContainer@1.4.0
    Variant: AutoLayout
    Properties:
      Height: =Parent.Height - conNavbar.Height
      LayoutDirection: =LayoutDirection.Vertical
      LayoutOverflowY: =LayoutOverflow.Scroll
      Width: =Parent.Width
      Y: =50
    Children:
      - conScrollScreen:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            FillPortions: =0
            Height: =1500
          Children:
            - lblSection1:
                Control: Text@0.0.51
                Properties:
                  Height: =52
                  Text: ="Section 1"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =1114
                  X: =105
                  Y: =30
