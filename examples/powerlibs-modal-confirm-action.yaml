- btnConfirmTrigger:
    Control: Button@0.0.45
    Properties:
      Appearance: ='ButtonCanvas.Appearance'.Primary
      BasePaletteColor: =RGBA(59, 130, 246, 1)
      Height: =40
      OnSelect: |-
        =UpdateContext({ varShowConfirm: true })
      Text: ="Delete record"
      Width: =160
      X: =40
      Y: =40
- btnConfirmScrim:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      BorderStyle: =BorderStyle.None
      BorderThickness: =0
      Color: =RGBA(0, 0, 0, 0)
      Fill: =RGBA(11, 18, 32, 0.45)
      FocusedBorderThickness: =0
      Height: =Parent.Height
      HoverBorderColor: =RGBA(0, 0, 0, 0)
      HoverColor: =RGBA(0, 0, 0, 0)
      HoverFill: =RGBA(11, 18, 32, 0.45)
      OnSelect: |-
        =UpdateContext({ varShowConfirm: false })
      PressedBorderColor: =RGBA(0, 0, 0, 0)
      PressedColor: =RGBA(0, 0, 0, 0)
      PressedFill: =RGBA(11, 18, 32, 0.45)
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Text: =""
      Tooltip: ="Close"
      Visible: =varShowConfirm
      Width: =Parent.Width
      X: =0
      Y: =0
- conConfirmPanel:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(21, 30, 48, 1)
      Height: =btnConfirmConfirm.Y + btnConfirmConfirm.Height + 24
      RadiusBottomLeft: =14
      RadiusBottomRight: =14
      RadiusTopLeft: =14
      RadiusTopRight: =14
      Visible: =varShowConfirm
      Width: =Min(420, Parent.Width - 40)
      X: =(Parent.Width - Self.Width) / 2
      Y: =(Parent.Height - Self.Height) / 2
    Children:
      - conConfirmBadge:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(239, 68, 68, 0.14)
            Height: =64
            RadiusBottomLeft: =32
            RadiusBottomRight: =32
            RadiusTopLeft: =32
            RadiusTopRight: =32
            Width: =64
            X: =(Parent.Width - 64) / 2
            Y: =28
          Children:
            - imgConfirmBadgeIcon:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Height: =28
                  Image: |-
                    ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#ef4444" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M10 11v6 M14 11v6'/></svg>")
                  ImagePosition: =ImagePosition.Fit
                  Width: =28
                  X: =18
                  Y: =18
      - lblConfirmTitle:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Center
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =32
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =20
            Text: ="Delete this record?"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Bold
            Width: =Parent.Width - 48
            X: =24
            Y: =108
      - lblConfirmDescription:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Center
            AutoHeight: =true
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =21
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =13
            Text: ="The record and its attachments are removed. This cannot be undone."
            VerticalAlign: =VerticalAlign.Top
            Weight: ='TextCanvas.Weight'.Regular
            Width: =Parent.Width - 48
            X: =24
            Y: =lblConfirmTitle.Y + lblConfirmTitle.Height + 6
      - btnConfirmCancel:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Outline
            Height: =44
            OnSelect: |-
              =UpdateContext({ varShowConfirm: false })
            Text: ="Cancel"
            Width: =(Parent.Width - 48 - 12) / 2
            X: =24
            Y: =lblConfirmDescription.Y + lblConfirmDescription.Height + 24
      - btnConfirmConfirm:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Primary
            BasePaletteColor: =RGBA(239, 68, 68, 1)
            Height: =44
            OnSelect: |-
              =// Put the action here, for example Remove(Orders, galOrders.Selected), then close
              UpdateContext({ varShowConfirm: false })
            Text: ="Delete"
            Width: =(Parent.Width - 48 - 12) / 2
            X: =btnConfirmCancel.X + btnConfirmCancel.Width + 12
            Y: =lblConfirmDescription.Y + lblConfirmDescription.Height + 24
      - imgConfirmClose:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            FocusedBorderThickness: =0
            Height: =14
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#8b99b0" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18 6 6 18 M6 6l12 12'/></svg>")
            ImagePosition: =ImagePosition.Fit
            OnSelect: |-
              =UpdateContext({ varShowConfirm: false })
            Width: =14
            X: =Parent.Width - 44 + 9
            Y: =21
