- conDocumentUploadCompact:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(75, 85, 99, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(31, 41, 55, 1)
      Height: =190
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Width: =360
      X: =40
      Y: =40
    Children:
      - lblDocumentUploadCompactLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(209, 213, 219, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =20
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            Text: ="Attachments"
            Width: =Parent.Width - 32
            X: =16
            Y: =12
      - lblDocumentUploadCompactHelper:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =16
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =8
            Text: ="Up to 10 files, PDF or Office documents"
            Width: =Parent.Width - 32
            X: =16
            Y: =Parent.Height - 26
      - attDocumentUploadCompactPicker:
          Control: Attachments@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =RGBA(59, 130, 246, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            Height: =Parent.Height - 70
            HoverFill: =RGBA(59, 130, 246, 0.05)
            ItemColor: =RGBA(255, 255, 255, 1)
            ItemFill: =RGBA(59, 130, 246, 0.28)
            ItemHoverColor: =RGBA(255, 255, 255, 1)
            ItemHoverFill: =RGBA(59, 130, 246, 0.38)
            MaxAttachments: =10
            PaddingBottom: =5
            PaddingLeft: =5
            PaddingRight: =5
            PaddingTop: =5
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(59, 130, 246, 0.9)
            Size: =10
            Width: =Parent.Width - 24
            X: =12
            Y: =38
