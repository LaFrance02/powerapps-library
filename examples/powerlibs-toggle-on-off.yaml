- conToggleOnOff:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =30
      Width: =167
      X: =40
      Y: =40
    Children:
      - imgToggleOnOffSwitch:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Height: =30
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 30' width='112' height='60'><g id='r" & Coalesce(varToggleOnOffRun, "0") & "'><rect width='56' height='30' rx='15' fill='" & If(varToggleOnOff, "#3B82F6", "#3C4B69") & "'><animate attributeName='fill' from='" & If(varToggleOnOff, "#3C4B69", "#3B82F6") & "' to='" & If(varToggleOnOff, "#3B82F6", "#3C4B69") & "' dur='" & If(IsBlank(varToggleOnOffRun), "1ms", "180ms") & "' fill='freeze'/></rect><text x='16' y='18.6' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' font-size='10' font-weight='700' fill='white' opacity='" & If(varToggleOnOff, "1", "0") & "'>ON</text><text x='42' y='18.6' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' font-size='10' font-weight='700' fill='white' opacity='" & If(varToggleOnOff, "0", "1") & "'>OFF</text><circle cy='15' r='13' fill='white'><animate attributeName='cx' from='" & If(varToggleOnOff, "15", "41") & "' to='" & If(varToggleOnOff, "41", "15") & "' dur='" & If(IsBlank(varToggleOnOffRun), "1ms", "180ms") & "' fill='freeze' calcMode='spline' keySplines='0.2 0 0 1'/></circle></g></svg>")
            ImagePosition: =ImagePosition.Fit
            Width: =56
            X: =0
            Y: =0
      - lblToggleOnOffLabel:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =Parent.Height
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =15
            Text: ="Out of office"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Semibold
            Width: =99
            X: =68
            Y: =0
      - btnToggleOnOff:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: |-
              =UpdateContext({ varToggleOnOff: !varToggleOnOff, varToggleOnOffRun: Text(Now(), "yyyymmddhhmmssfff") })
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Text: =""
            Tooltip: ="Out of office"
            Width: =Parent.Width
            X: =0
            Y: =0
