- conRailShellContent:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =If(gblRailShellDark, RGBA(11, 18, 32, 1), RGBA(244, 244, 245, 1))
      Height: =Parent.Height - Self.Y - If(Parent.Width < 768, 64, 0)
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Width: =Parent.Width - Self.X
      X: =If(Parent.Width < 768, 0, conRailShellSidebar.Width)
      Y: =If(Parent.Width < 768, 56, 0)
    Children:
      - lblRailShellContentHint:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Center
            FontColor: =If(gblRailShellDark, RGBA(139, 153, 176, 1), RGBA(113, 113, 122, 1))
            Height: =21
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =13
            Text: ="Your content goes here"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height / 2 + 30
      - lblRailShellContentPage:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Center
            FontColor: =If(gblRailShellDark, RGBA(230, 234, 242, 1), RGBA(24, 24, 27, 1))
            Height: =34
