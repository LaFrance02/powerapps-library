- lblAmountCaption:
    Control: Label@2.5.1
    Properties:
      Color: =RGBA(209, 213, 219, 1)
      Font: =Font.'Open Sans'
      Height: =18
      PaddingBottom: =0
      PaddingTop: =0
      Size: =10
      Text: ="Amount"
      Width: =280
      X: =40
      Y: =58

- txtAmount:
    Control: Classic/TextInput@2.3.2
    Properties:
      BorderColor: =RGBA(75, 85, 99, 1)
      BorderThickness: =1
      Color: =RGBA(255, 255, 255, 1)
      Default: =""
      DisabledFill: =RGBA(55, 65, 81, 1)
      Fill: =RGBA(55, 65, 81, 1)
      FocusedBorderColor: =RGBA(59, 130, 246, 1)
      FocusedBorderThickness: =1
      Font: =Font.'Open Sans'
      Format: =TextFormat.Number
      Height: =32
      HintText: ="0.00"
      HoverBorderColor: =Self.BorderColor
      Mode: =TextMode.SingleLine
      PaddingLeft: =26
      PressedBorderColor: =Self.BorderColor
      Size: =11
      Width: =280
      X: =40
      Y: =80

- lblAmountSymbol:
    Control: Label@2.5.1
    Properties:
      Color: =RGBA(156, 163, 175, 1)
      Font: =Font.'Open Sans'
      Height: =32
      PaddingLeft: =0
      Size: =11
      Text: ="$"
      Width: =18
      X: =txtAmount.X + 8
      Y: =txtAmount.Y

- lblAmountHelper:
    Control: Label@2.5.1
    Properties:
      Color: =RGBA(156, 163, 175, 1)
      Font: =Font.'Open Sans'
      Height: =16
      PaddingBottom: =0
      PaddingTop: =0
      Size: =9
      Text: ="Excluding tax"
      Width: =280
      X: =40
      Y: =txtAmount.Y + txtAmount.Height + 4
