- conProfileCard:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(34, 48, 74, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(21, 30, 48, 1)
      Height: =232
      RadiusBottomLeft: =16
      RadiusBottomRight: =16
      RadiusTopLeft: =16
      RadiusTopRight: =16
      Width: =360
      X: =(Parent.Width - Self.Width) / 2
      Y: =(Parent.Height - Self.Height) / 2
    Children:
      - conProfileAvatar:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(59, 130, 246, 0.12)
            Height: =56
            RadiusBottomLeft: =28
            RadiusBottomRight: =28
            RadiusTopLeft: =28
            RadiusTopRight: =28
            Width: =56
            X: =20
            Y: =20
          Children:
            - lblProfileAvatarInitials:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Center
                  FontColor: =RGBA(59, 130, 246, 1)
                  Height: =Parent.Height
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =21
                  Text: ="JD"
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - lblProfileName:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =31
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =19
            Text: ="John Doe"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Bold
            Width: =Parent.Width - 112
            X: =92
            Y: =20
      - lblProfileRole:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =24
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =15
            Text: ="Sales Manager, Berlin office"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =Parent.Width - 112
            X: =92
            Y: =46
      - conProfileStat1:
