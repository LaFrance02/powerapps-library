- conUserChip:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(55, 65, 81, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(31, 41, 55, 1)
      Height: =36
      RadiusBottomLeft: =18
      RadiusBottomRight: =18
      RadiusTopLeft: =18
      RadiusTopRight: =18
      Width: =51 + Len(User().FullName) * 8
      X: =40
      Y: =40
    Children:
      - conUserChipAvatar:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(59, 130, 246, 1)
            Height: =26
            RadiusBottomLeft: =13
            RadiusBottomRight: =13
            RadiusTopLeft: =13
            RadiusTopRight: =13
            Width: =26
            X: =5
            Y: =5
          Children:
            - lblUserChipInitials:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.Height
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: =Upper(Left(User().FullName, 1) & Mid(User().FullName, Find(" ", User().FullName & " ") + 1, 1))
                  Width: =Parent.Width
            - conUserChipPresence:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(31, 41, 55, 1)
                  BorderThickness: =2
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(34, 197, 94, 1)
                  Height: =10
                  RadiusBottomLeft: =5
                  RadiusBottomRight: =5
                  RadiusTopLeft: =5
                  RadiusTopRight: =5
                  Width: =10
                  X: =Parent.Width - 12
                  Y: =Parent.Height - 12
      - lblUserChipName:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =13
            Text: =User().FullName
            Width: =Parent.Width - 51
            X: =39
