- btnOpenCommentsDrawer:
    Control: Button@0.0.45
    Properties:
      Appearance: ='ButtonCanvas.Appearance'.Primary
      BasePaletteColor: =RGBA(59, 130, 246, 1)
      Height: =40
      OnSelect: |-
        =If(IsEmpty(colDrawerComments), Collect(colDrawerComments,
                                { author: "Hans Muster", when: "2 h ago", text: "Restarted the print server, still offline. Looks like the network cable behind the desk." },
                                { author: "Hanako Yamada", when: "1 h ago", text: "Facilities is on it. Should be back before noon." },
                                { author: "Anna Muster", when: "20 min ago", text: "Thanks. Please close the ticket once confirmed." }
                            )); UpdateContext({ varShowCommentsDrawer: true })
      Text: ="Comments"
      Width: =150
      X: =24
      Y: =24
- recCommentsDrawerScrim:
    Control: Rectangle@2.3.0
    Properties:
      BorderThickness: =0
      Fill: =RGBA(11, 18, 32, 0.55)
      Height: =Parent.Height
      HoverFill: =RGBA(11, 18, 32, 0.55)
      OnSelect: |-
        =UpdateContext({ varShowCommentsDrawer: false })
      PressedFill: =RGBA(11, 18, 32, 0.55)
      Tooltip: ="Close"
      Visible: =varShowCommentsDrawer
      Width: =Parent.Width
      X: =0
      Y: =0
- conCommentsDrawer:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(21, 30, 48, 1)
      Height: =Parent.Height
      RadiusBottomLeft: =If(Self.Width >= Parent.Width, 0, 16)
      RadiusBottomRight: =0
      RadiusTopLeft: =If(Self.Width >= Parent.Width, 0, 16)
      RadiusTopRight: =0
      Visible: =varShowCommentsDrawer
      Width: =Min(420, Parent.Width)
      X: =Parent.Width - Self.Width
      Y: =0
    Children:
      - lblCommentsDrawerTitle:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =31
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =19
            Text: ="Comments"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Bold
            Width: =Parent.Width - 88
            X: =24
            Y: =20
      - lblCommentsDrawerDescription:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =21
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =13
            Text: ="Ticket HD-231, Printer on floor 3 offline"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =Parent.Width - 88
            X: =24
            Y: =46
      - imgCommentsDrawerClose:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            FocusedBorderThickness: =0
            Height: =16
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#8b99b0" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18 6 6 18 M6 6l12 12'/></svg>")
            ImagePosition: =ImagePosition.Fit
            OnSelect: |-
              =UpdateContext({ varShowCommentsDrawer: false })
            Width: =16
            X: =Parent.Width - 56 + 8
            Y: =28
      - lblCommentsCount:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.End
            FontColor: =RGBA(93, 107, 132, 1)
            Height: =20
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: =CountRows(colDrawerComments) & If(CountRows(colDrawerComments) = 1, " comment", " comments")
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =200
            X: =Parent.Width - 200 - 56
            Y: =24
      - conCommentsHeaderRule:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(34, 48, 74, 1)
            Height: =1
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            X: =0
            Y: =80
      - galComments:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Height: =Parent.Height - 96 - Self.Y
            Items: =colDrawerComments
            ShowScrollbar: =false
            TemplatePadding: =8
            TemplateSize: =84
            Width: =Parent.Width - 48
            X: =24
            Y: =92
          Children:
            - conCommentAvatar:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(59, 130, 246, 0.12)
                  Height: =32
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =32
                  X: =0
                  Y: =8
                Children:
                  - lblCommentAvatarInitials:
                      Control: Text@0.0.51
                      Properties:
                        Align: ='TextCanvas.Align'.Center
                        FontColor: =RGBA(59, 130, 246, 1)
                        Height: =Parent.Height
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =Upper(Left(ThisItem.author, 1) & Mid(ThisItem.author, Find(" ", ThisItem.author & " ") + 1, 1))
                        VerticalAlign: =VerticalAlign.Middle
                        Weight: ='TextCanvas.Weight'.Bold
                        Width: =Parent.Width
                        X: =0
                        Y: =0
            - lblCommentAuthor:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Start
                  FontColor: =RGBA(230, 234, 242, 1)
                  Height: =21
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  Text: =ThisItem.author
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Semibold
                  Width: =Parent.TemplateWidth - 130
                  X: =42
                  Y: =8
            - lblCommentWhen:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.End
                  FontColor: =RGBA(93, 107, 132, 1)
                  Height: =20
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.when
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: =90
                  X: =Parent.TemplateWidth - 90
                  Y: =8
            - lblCommentText:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Start
                  FontColor: =RGBA(180, 190, 206, 1)
                  Height: =44
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  Text: =ThisItem.text
                  VerticalAlign: =VerticalAlign.Top
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: =Parent.TemplateWidth - 42
                  X: =42
                  Y: =26
      - conCommentsFooterRule:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(34, 48, 74, 1)
            Height: =1
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - 96
      - txtCommentDraft:
          Control: TextInput@0.0.54
          Properties:
            BorderColor: =RGBA(60, 75, 105, 1)
            BorderThickness: =1
            Fill: =RGBA(21, 30, 48, 1)
            Font: =Font.'Open Sans'
            Height: =44
            Placeholder: ="Write a comment"
            Value: =""
            Width: =Parent.Width - 48 - 96 - 8
            X: =24
            Y: =Parent.Height - 76
      - btnCommentSend:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Primary
            BasePaletteColor: =RGBA(59, 130, 246, 1)
            Height: =44
            OnSelect: |-
              =If(!IsBlank(Trim(txtCommentDraft.Value)), Collect(colDrawerComments, { author: User().FullName, when: "Just now", text: Trim(txtCommentDraft.Value) }); Reset(txtCommentDraft))
            Text: ="Send"
            Width: =96
            X: =Parent.Width - 24 - 96
            Y: =Parent.Height - 76
