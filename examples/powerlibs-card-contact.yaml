- conContactCard:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(34, 48, 74, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(21, 30, 48, 1)
      Height: =btnContactPrimary.Y + btnContactPrimary.Height + 20
      RadiusBottomLeft: =16
      RadiusBottomRight: =16
      RadiusTopLeft: =16
      RadiusTopRight: =16
      Width: =340
      X: =(Parent.Width - Self.Width) / 2
      Y: =(Parent.Height - Self.Height) / 2
    Children:
      - conContactAvatar:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(59, 130, 246, 0.12)
            Height: =56
            RadiusBottomLeft: =28
            RadiusBottomRight: =28
            RadiusTopLeft: =28
            RadiusTopRight: =28
            Width: =56
            X: =20
            Y: =20
          Children:
            - lblContactAvatarInitials:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Center
                  FontColor: =RGBA(59, 130, 246, 1)
                  Height: =Parent.Height
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =21
                  Text: ="AM"
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - lblContactName:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            AutoHeight: =true
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =31
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =19
            Text: ="Anna Muster"
            VerticalAlign: =VerticalAlign.Top
            Weight: ='TextCanvas.Weight'.Bold
            Width: =228
            X: =92
            Y: =20
      - lblContactRole:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            AutoHeight: =true
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =24
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =15
            Text: ="Head of Operations at Nordic Supply"
            VerticalAlign: =VerticalAlign.Top
            Weight: ='TextCanvas.Weight'.Regular
            Width: =228
            X: =92
            Y: =lblContactName.Y + lblContactName.Height
      - conContactDivider:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(34, 48, 74, 1)
            Height: =1
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =300
            X: =20
            Y: =Max(lblContactRole.Y + lblContactRole.Height, 76) + 20
      - imgContactEmailIcon:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Height: =16
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#8b99b0" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M22 6l-10 7L2 6'/></svg>")
            ImagePosition: =ImagePosition.Fit
            Width: =16
            X: =22
            Y: =conContactDivider.Y + 16 + 0 + 4 + 2
      - lblContactEmail:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(180, 190, 206, 1)
            Height: =28
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =15
            Text: ="anna.muster@example.com"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =270
            X: =50
            Y: =conContactDivider.Y + 16 + 0
      - imgContactPhoneIcon:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Height: =16
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#8b99b0" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z'/></svg>")
            ImagePosition: =ImagePosition.Fit
            Width: =16
            X: =22
            Y: =conContactDivider.Y + 16 + 32 + 4 + 2
      - lblContactPhone:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(180, 190, 206, 1)
            Height: =28
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =15
            Text: ="+46 70 123 45 67"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =270
            X: =50
            Y: =conContactDivider.Y + 16 + 32
      - imgContactLocationIcon:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Height: =16
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#8b99b0" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z M15 10a3 3 0 1 1-6 0 3 3 0 0 1 6 0z'/></svg>")
            ImagePosition: =ImagePosition.Fit
            Width: =16
            X: =22
            Y: =conContactDivider.Y + 16 + 64 + 4 + 2
      - lblContactLocation:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(180, 190, 206, 1)
            Height: =28
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =15
            Text: ="Stockholm, Sweden"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =270
            X: =50
            Y: =conContactDivider.Y + 16 + 64
      - btnContactPrimary:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Primary
            BasePaletteColor: =RGBA(59, 130, 246, 1)
            Height: =40
            OnSelect: =Launch("mailto:" & lblContactEmail.Text)
            Text: ="Email"
            Width: =146
            X: =20
            Y: =conContactDivider.Y + 120
      - btnContactSecondary:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Outline
            Height: =40
            OnSelect: =Launch("tel:" & lblContactPhone.Text)
            Text: ="Call"
            Width: =146
            X: =174
            Y: =conContactDivider.Y + 120
