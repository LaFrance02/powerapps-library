- btnAddNotification:
    Control: Classic/Button@2.2.0
    Properties:
      FocusedBorderThickness: =0
      BorderStyle: =BorderStyle.None
      Color: =RGBA(255, 255, 255, 1)
      Fill: =RGBA(59, 130, 246, 1)
      Height: =32
      HoverBorderColor: =ColorFade(Self.BorderColor, -20%)
      HoverColor: =Self.Color
      HoverFill: =ColorFade(Self.Fill, -10%)
      OnSelect: |-
        =Collect(colNotifications, {
          ID: GUID(),
          Message: "Settings were saved.",
          Timestamp: Now(),
          Show: true
        })
      PressedBorderColor: =ColorFade(Self.BorderColor, -40%)
      PressedFill: =ColorFade(Self.Fill, -20%)
      RadiusBottomLeft: =5
      RadiusBottomRight: =5
      RadiusTopLeft: =5
      RadiusTopRight: =5
      Size: =11
      Text: ="Press for Notification"
      X: =564
      Y: =396
- galNotifications:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      Height: =Min(CountRows(colNotifications) * 76, 400)
      Items: =colNotifications
      ShowScrollbar: =false
      TemplateSize: =60
      Visible: =CountRows(colNotifications) > 0
      Width: =350
      X: =Parent.Width - Self.Width - 20
      Y: =20
    Children:
      - conNotification:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Semilight
            Fill: =RGBA(30, 41, 56, 1)
            Height: =50
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Width: =Parent.TemplateWidth*80%
            X: =Parent.TemplateWidth/2 - Self.Width/2
            Y: =5
          Children:
            - lblPrimary:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(209, 213, 219, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =25
                  Size: =11
                  Text: =ThisItem.Message
                  Width: =(icoCancel.X - 10) - (conItemToast.X + conItemToast.Width + 10)
                  X: =conItemToast.X + conItemToast.Width + 10
                  Y: =Parent.Height/2 - Self.Height/2
            - icoCancel:
                Control: Classic/Icon@2.5.0
                Properties:
                  FocusedBorderThickness: =0
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(202, 202, 202, 1)
                  Height: =12
                  Icon: =Icon.Cancel
                  OnSelect: =Remove(colNotifications, ThisItem)
                  Width: =12
                  X: =Parent.Width - Self.Width - 15
                  Y: =Parent.Height/2 - Self.Height/2
            - conItemToast:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(6, 95, 70, 1)
                  Height: =40
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  Width: =40
                  X: =15
                  Y: =Parent.Height/2 - Self.Height/2
                Children:
                  - icoToast:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(52, 211, 153, 1)
                        DisplayMode: =DisplayMode.View
                        Height: =25
                        Icon: =Icon.Check
                        Width: =25
                        X: =Parent.Width/2 - Self.Width/2
                        Y: =Parent.Height/2 - Self.Height/2
            - NotificationItem:
                Control: Timer@2.1.0
                Properties:
                  AutoStart: =true
                  Duration: =3000
                  OnTimerEnd: =Remove(colNotifications, ThisItem)
                  Visible: =false
