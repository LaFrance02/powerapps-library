- btnReloadChart:
    Control: Classic/Button@2.2.0
    Properties:
      FocusedBorderThickness: =2
      X: =710
      Y: =50
      Width: =200
      Height: =48
      
      Text: ="↻ Replay Animation"
      Font: =Font.'Segoe UI'
      
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(59, 130, 246, 1)
      BorderColor: =RGBA(59, 130, 246, 1)
      
      HoverFill: =RGBA(239, 246, 255, 1)
      HoverColor: =RGBA(37, 99, 235, 1)
      HoverBorderColor: =RGBA(37, 99, 235, 1)
      
      PressedFill: =RGBA(219, 234, 254, 1)
      PressedColor: =RGBA(29, 78, 216, 1)
      PressedBorderColor: =RGBA(29, 78, 216, 1)
      
      RadiusTopLeft: =12
      RadiusTopRight: =12
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      
      OnSelect: =Set(varChartReload, varChartReload + 1)
