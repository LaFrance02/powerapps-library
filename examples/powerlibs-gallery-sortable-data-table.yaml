                      {Name:"Juan Perez", Department:"Sales", Email:"juan.perez@contoso.com", Status:"Active"}
                  ),
                  txtSortTableSearch.Value in Name || txtSortTableSearch.Value in Department || txtSortTableSearch.Value in Email || txtSortTableSearch.Value in Status
