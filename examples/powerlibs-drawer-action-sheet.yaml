- btnOpenActionSheet:
    Control: Button@0.0.45
    Properties:
      Appearance: ='ButtonCanvas.Appearance'.Primary
      BasePaletteColor: =RGBA(59, 130, 246, 1)
      Height: =40
      OnSelect: |-
        =UpdateContext({ varShowActionSheet: true })
      Text: ="More actions"
      Width: =150
      X: =24
      Y: =24
- recActionSheetScrim:
    Control: Rectangle@2.3.0
    Properties:
      BorderThickness: =0
      Fill: =RGBA(11, 18, 32, 0.55)
      Height: =Parent.Height
      HoverFill: =RGBA(11, 18, 32, 0.55)
      OnSelect: |-
        =UpdateContext({ varShowActionSheet: false })
      PressedFill: =RGBA(11, 18, 32, 0.55)
      Tooltip: ="Close"
      Visible: =varShowActionSheet
      Width: =Parent.Width
      X: =0
      Y: =0
- conActionSheet:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(21, 30, 48, 1)
      Height: =Min(428, Parent.Height - 40)
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =20
      RadiusTopRight: =20
      Visible: =varShowActionSheet
      Width: =Parent.Width
      X: =0
      Y: =Parent.Height - Self.Height
    Children:
      - conActionSheetHandle:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(60, 75, 105, 1)
            Height: =4
            RadiusBottomLeft: =2
            RadiusBottomRight: =2
            RadiusTopLeft: =2
            RadiusTopRight: =2
            Width: =40
            X: =(Parent.Width - 40) / 2
            Y: =10
      - lblActionSheetTitle:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =26
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =16
            Text: ="Prepare Q4 pricing proposal"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Bold
            Width: =Parent.Width - 48
            X: =24
            Y: =26
      - lblActionSheetSub:
