- conFab:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(59, 130, 246, 1)
      Height: =56
      RadiusBottomLeft: =28
      RadiusBottomRight: =28
      RadiusTopLeft: =28
      RadiusTopRight: =28
      Width: =144
      X: =Parent.Width - Self.Width - 24
      Y: =Parent.Height - Self.Height - 24
    Children:
      - icoFabIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =25
            Icon: =Icon.Add
            PaddingBottom: =2
            PaddingLeft: =2
            PaddingRight: =2
            PaddingTop: =2
            Width: =25
            X: =18
            Y: =(Parent.Height - 25) / 2
      - lblFabText:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: ="New request"
            VerticalAlign: =VerticalAlign.Middle
            Width: =Parent.Width - 73
            X: =53
            Y: =0
      - btnFab:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(255, 255, 255, 0.12)
            OnSelect: |-
              =// Put your action here, for example Navigate(NewRequestScreen)
              false
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(255, 255, 255, 0.22)
            RadiusBottomLeft: =28
            RadiusBottomRight: =28
            RadiusTopLeft: =28
            RadiusTopRight: =28
            Text: =""
            Tooltip: ="New request"
            Width: =Parent.Width
            X: =0
            Y: =0
