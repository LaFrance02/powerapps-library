      Fill: =RGBA(31, 41, 55, 1)
      Height: =104
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Width: =220
      X: =40
      Y: =80
    Children:
      - lblKpiCaption:
          Control: Label@2.5.1
