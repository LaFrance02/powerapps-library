- lblSearchCaption:
    Control: Label@2.5.1
    Properties:
      Color: =RGBA(209, 213, 219, 1)
      Font: =Font.'Open Sans'
      Height: =18
      PaddingBottom: =0
      PaddingTop: =0
      Size: =10
      Text: ="Search"
      Width: =280
      X: =40
      Y: =58

- txtSearch:
    Control: Classic/TextInput@2.3.2
    Properties:
      BorderColor: =RGBA(75, 85, 99, 1)
      BorderThickness: =1
      Color: =RGBA(255, 255, 255, 1)
      Default: =""
      DisabledFill: =RGBA(55, 65, 81, 1)
      Fill: =RGBA(55, 65, 81, 1)
      FocusedBorderColor: =RGBA(59, 130, 246, 1)
      FocusedBorderThickness: =1
      Font: =Font.'Open Sans'
      Height: =32
      HintText: ="Type to search..."
      HoverBorderColor: =Self.BorderColor
      Mode: =TextMode.SingleLine
      PaddingLeft: =10
      PressedBorderColor: =Self.BorderColor
      Size: =11
      Width: =280
      X: =40
      Y: =80

- icoSearchClear:
    Control: Classic/Icon@2.5.0
    Properties:
      FocusedBorderThickness: =0
      Color: =RGBA(156, 163, 175, 1)
      Height: =18
      Icon: =Icon.Cancel
      OnSelect: |-
        =UpdateContext({ varSearchCleared: true }); Reset(txtSearch)
      Tooltip: ="Clear the field"
      Visible: =!IsBlank(txtSearch.Text)
      Width: =18
      X: =txtSearch.X + txtSearch.Width - Self.Width - 8
      Y: =txtSearch.Y + (txtSearch.Height - Self.Height) / 2

- lblSearchHelper:
    Control: Label@2.5.1
    Properties:
      Color: =RGBA(156, 163, 175, 1)
      Font: =Font.'Open Sans'
      Height: =16
      PaddingBottom: =0
      PaddingTop: =0
      Size: =9
      Text: ="Click the x to clear the field"
      Width: =280
      X: =40
      Y: =txtSearch.Y + txtSearch.Height + 4
