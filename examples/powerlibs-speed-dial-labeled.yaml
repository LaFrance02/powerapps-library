- conLabeledDialMain:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(59, 130, 246, 1)
      Height: =56
      RadiusBottomLeft: =28
      RadiusBottomRight: =28
      RadiusTopLeft: =28
      RadiusTopRight: =28
      Width: =56
      X: =Parent.Width - 80
      Y: =Parent.Height - 80
    Children:
      - imgLabeledDialIcon:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Height: =28
            Image: ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='48' height='48'><g id='run" & Coalesce(varLabeledDialRun, "0") & "'><path d='M12 5 V19 M5 12 H19' stroke='white' stroke-width='2.5' stroke-linecap='round' fill='none'/><animateTransform attributeName='transform' type='rotate' from='" & If(varLabeledDialOpen, "0", "45") & " 12 12' to='" & If(varLabeledDialOpen, "45", "0") & " 12 12' dur='" & If(IsBlank(varLabeledDialRun), "1ms", "220ms") & "' fill='freeze' calcMode='spline' keySplines='0.2 0 0 1'/></g></svg>")
            Width: =28
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
      - btnLabeledDialMain:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(255, 255, 255, 0.12)
            OnSelect: =Set(varLabeledDialOpen, !varLabeledDialOpen); Set(varLabeledDialRun, Text(Now(), "yyyymmddhhmmssfff"))
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(255, 255, 255, 0.22)
            RadiusBottomLeft: =28
            RadiusBottomRight: =28
            RadiusTopLeft: =28
            RadiusTopRight: =28
            Text: =""
            Tooltip: ="Actions"
            Width: =Parent.Width
            X: =0
            Y: =0
