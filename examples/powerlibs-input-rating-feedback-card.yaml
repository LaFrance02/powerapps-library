- conRatingFeedback:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(59, 130, 246, 0.5)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(59, 130, 246, 0.18)
      Height: =190
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =360
      X: =40
      Y: =40
    Children:
      - lblRatingFeedbackTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(229, 231, 235, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =11
            Text: ="Rate your experience"
            Width: =Parent.Width - 32
            X: =16
            Y: =22
      - rtgRatingFeedback:
          Control: Rating
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Default: =0
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =44
            Max: =5
            RatingFill: =RGBA(59, 130, 246, 1)
            ReadOnly: =false
            ShowValue: =false
            Width: =240
            X: =Parent.Width / 2 - Self.Width / 2
            Y: =62
      - lblRatingFeedbackSentiment:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(59, 130, 246, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            Text: |-
              =If(
                  rtgRatingFeedback.Value < 1,
                  "Tap a star to rate",
                  Switch(
                      RoundUp(rtgRatingFeedback.Value * 5 / rtgRatingFeedback.Max, 0),
                      1, "Poor",
                      2, "Fair",
                      3, "Good",
                      4, "Great",
                      5, "Excellent"
                  )
              )
            Width: =Parent.Width - 32
            X: =16
            Y: =126
