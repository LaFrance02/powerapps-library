- lblPasswordCaption:
    Control: Label@2.5.1
    Properties:
      Color: =RGBA(209, 213, 219, 1)
      Font: =Font.'Open Sans'
      Height: =18
      PaddingBottom: =0
      PaddingTop: =0
      Size: =10
      Text: ="Password"
      Width: =280
      X: =40
      Y: =58

- txtPassword:
    Control: Classic/TextInput@2.3.2
    Properties:
      BorderColor: =RGBA(75, 85, 99, 1)
      BorderThickness: =1
      Color: =RGBA(255, 255, 255, 1)
      Default: =""
      DisabledFill: =RGBA(55, 65, 81, 1)
      Fill: =RGBA(55, 65, 81, 1)
      FocusedBorderColor: =RGBA(59, 130, 246, 1)
      FocusedBorderThickness: =1
      Font: =Font.'Open Sans'
      Height: =32
      HintText: ="Enter your password"
      HoverBorderColor: =Self.BorderColor
      Mode: =If(varShowPassword, TextMode.SingleLine, TextMode.Password)
      PaddingLeft: =10
      PressedBorderColor: =Self.BorderColor
      Size: =11
      Width: =280
      X: =40
      Y: =80

- icoPasswordReveal:
    Control: Classic/Icon@2.5.0
    Properties:
      FocusedBorderThickness: =0
      Color: =RGBA(156, 163, 175, 1)
      Height: =18
      Icon: =If(varShowPassword, Icon.Hide, Icon.View)
      OnSelect: |-
        =UpdateContext({ varShowPassword: !varShowPassword })
      Tooltip: =If(varShowPassword, "Hide password", "Show password")
      Width: =18
      X: =txtPassword.X + txtPassword.Width - Self.Width - 8
      Y: =txtPassword.Y + (txtPassword.Height - Self.Height) / 2

- lblPasswordHelper:
    Control: Label@2.5.1
    Properties:
      Color: =RGBA(156, 163, 175, 1)
      Font: =Font.'Open Sans'
      Height: =16
      PaddingBottom: =0
      PaddingTop: =0
      Size: =9
      Text: ="At least 8 characters"
      Width: =280
      X: =40
      Y: =txtPassword.Y + txtPassword.Height + 4
