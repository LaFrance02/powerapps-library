- conRatingCompact:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(75, 85, 99, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(31, 41, 55, 1)
      Height: =56
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Width: =360
      X: =40
      Y: =40
    Children:
      - lblRatingCompactLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(209, 213, 219, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =20
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            Text: ="Rating"
            Width: =150
            X: =16
            Y: =18
      - rtgRatingCompact:
          Control: Rating
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Default: =3
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =28
            Max: =5
            RatingFill: =RGBA(59, 130, 246, 1)
            ReadOnly: =false
            ShowValue: =false
            Width: =160
            X: =Parent.Width - Self.Width - 12
            Y: =14
