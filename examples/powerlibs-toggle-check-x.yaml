- conToggleCheckX:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =24
      Width: =183
      X: =40
      Y: =40
    Children:
      - imgToggleCheckXSwitch:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Height: =24
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 24' width='88' height='48'><g id='r" & Coalesce(varToggleCheckXRun, "0") & "'><rect width='44' height='24' rx='12' fill='" & If(Coalesce(varToggleCheckX, true), "#22C55E", "#EF4444") & "'><animate attributeName='fill' from='" & If(Coalesce(varToggleCheckX, true), "#EF4444", "#22C55E") & "' to='" & If(Coalesce(varToggleCheckX, true), "#22C55E", "#EF4444") & "' dur='" & If(IsBlank(varToggleCheckXRun), "1ms", "180ms") & "' fill='freeze'/></rect><path d='M7.96 12 l3.5279999999999996 3.5279999999999996 l6.5520000000000005 -7.055999999999999' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' opacity='" & If(Coalesce(varToggleCheckX, true), "1", "0") & "'/><path d='M26.968 7.968 l8.064 8.064 M35.032 7.968 l-8.064 8.064' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' opacity='" & If(Coalesce(varToggleCheckX, true), "0", "1") & "'/><circle cy='12' r='10' fill='white'><animate attributeName='cx' from='" & If(Coalesce(varToggleCheckX, true), "12", "32") & "' to='" & If(Coalesce(varToggleCheckX, true), "32", "12") & "' dur='" & If(IsBlank(varToggleCheckXRun), "1ms", "180ms") & "' fill='freeze' calcMode='spline' keySplines='0.2 0 0 1'/></circle></g></svg>")
            ImagePosition: =ImagePosition.Fit
            Width: =44
            X: =0
            Y: =0
      - lblToggleCheckXLabel:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =Parent.Height
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =15
            Text: ="Passed inspection"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Semibold
            Width: =127
            X: =56
            Y: =0
      - btnToggleCheckX:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: |-
              =UpdateContext({ varToggleCheckX: !Coalesce(varToggleCheckX, true), varToggleCheckXRun: Text(Now(), "yyyymmddhhmmssfff") })
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Text: =""
            Tooltip: ="Passed inspection"
            Width: =Parent.Width
            X: =0
            Y: =0
