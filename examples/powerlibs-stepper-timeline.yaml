- conTimelineSection:
    Control: GroupContainer@1.4.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(30, 41, 56, 1)
      Height: =440
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =388
      X: =40
      Y: =30
    Children:
      - lblTimeTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(243, 244, 246, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="Timeline Progress"
            Width: =300
            X: =20
            Y: =16
      - lblTimeSubtitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =20
            Size: =9
            Text: ="Order fulfillment tracker"
            Width: =300
            X: =20
            Y: =42
      - lblTimeStepLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =If(varTimeStep >= 4, RGBA(34, 197, 94, 1), RGBA(59, 130, 246, 1))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =10
            Text: =If(varTimeStep >= 4, "✓ Delivered", "Step " & Min(varTimeStep, 4) & " of 4")
            X: =Parent.Width - 170
            Y: =16
      - conTL1Dot:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =If(varTimeStep >= 1, RGBA(59, 130, 246, 1), RGBA(75, 85, 99, 1))
            Height: =20
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =20
            X: =35
            Y: =80
      - conTL1Line:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =If(varTimeStep >= 2, RGBA(59, 130, 246, 1), RGBA(75, 85, 99, 1))
            Height: =50
            Width: =2
            X: =conTL1Dot.X + conTL1Dot.Width / 2 - 1
            Y: =conTL1Dot.Y + conTL1Dot.Height
      - lblTL1Title:
          Control: Label@2.5.1
          Properties:
            Color: =If(varTimeStep >= 1, RGBA(243, 244, 246, 1), RGBA(156, 163, 175, 1))
            Font: =Font.'Open Sans'
            FontWeight: =If(varTimeStep >= 1, FontWeight.Semibold, FontWeight.Normal)
            Height: =20
            Size: =10
            Text: ="Order Placed"
            Width: =300
            X: =66
            Y: =conTL1Dot.Y
      - lblTL1Desc:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =18
            Size: =8
            Text: ="Your order has been received and confirmed."
            Width: =350
            X: =66
            Y: =lblTL1Title.Y + lblTL1Title.Height
      - conTL2Dot:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =If(varTimeStep >= 2, RGBA(59, 130, 246, 1), RGBA(75, 85, 99, 1))
            Height: =20
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =20
            X: =35
            Y: =150
      - conTL2Line:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =If(varTimeStep >= 3, RGBA(59, 130, 246, 1), RGBA(75, 85, 99, 1))
            Height: =50
            Width: =2
            X: =conTL2Dot.X + conTL2Dot.Width / 2 - 1
            Y: =conTL2Dot.Y + conTL2Dot.Height
      - lblTL2Title:
          Control: Label@2.5.1
          Properties:
            Color: =If(varTimeStep >= 2, RGBA(243, 244, 246, 1), RGBA(156, 163, 175, 1))
            Font: =Font.'Open Sans'
            FontWeight: =If(varTimeStep >= 2, FontWeight.Semibold, FontWeight.Normal)
            Height: =20
            Size: =10
            Text: ="Processing"
            Width: =300
            X: =66
            Y: =conTL2Dot.Y
      - lblTL2Desc:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =18
            Size: =8
            Text: ="Items are being picked and packed at the warehouse."
            Width: =350
            X: =66
            Y: =lblTL2Title.Y + lblTL2Title.Height
      - conTL3Dot:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =If(varTimeStep >= 3, RGBA(59, 130, 246, 1), RGBA(75, 85, 99, 1))
            Height: =20
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =20
            X: =35
            Y: =220
      - conTL3Line:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =If(varTimeStep >= 4, RGBA(59, 130, 246, 1), RGBA(75, 85, 99, 1))
            Height: =50
            Width: =2
            X: =conTL3Dot.X + conTL3Dot.Width / 2 - 1
            Y: =conTL3Dot.Y + conTL3Dot.Height
      - lblTL3Title:
          Control: Label@2.5.1
          Properties:
            Color: =If(varTimeStep >= 3, RGBA(243, 244, 246, 1), RGBA(156, 163, 175, 1))
            Font: =Font.'Open Sans'
            FontWeight: =If(varTimeStep >= 3, FontWeight.Semibold, FontWeight.Normal)
            Height: =20
            Size: =10
            Text: ="Shipped"
            Width: =300
            X: =66
            Y: =conTL3Dot.Y
      - lblTL3Desc:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =18
            Size: =8
            Text: ="Package has been handed to the courier for delivery."
            Width: =350
            X: =66
            Y: =lblTL3Title.Y + lblTL3Title.Height
      - conTL4Dot:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =If(varTimeStep >= 4, RGBA(34, 197, 94, 1), RGBA(75, 85, 99, 1))
            Height: =20
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =20
            X: =35
            Y: =290
      - lblTL4Title:
          Control: Label@2.5.1
          Properties:
            Color: =If(varTimeStep >= 4, RGBA(34, 197, 94, 1), RGBA(156, 163, 175, 1))
            Font: =Font.'Open Sans'
            FontWeight: =If(varTimeStep >= 4, FontWeight.Semibold, FontWeight.Normal)
            Height: =20
            Size: =10
            Text: ="Delivered"
            Width: =300
            X: =66
            Y: =conTL4Dot.Y
      - lblTL4Desc:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =18
            Size: =8
            Text: ="Package delivered to your doorstep. Enjoy!"
            Width: =350
            X: =66
            Y: =lblTL4Title.Y + lblTL4Title.Height
      - lblTimeStatus:
          Control: Label@2.5.1
          Properties:
            Color: =If(varTimeStep >= 4, RGBA(34, 197, 94, 1), RGBA(156, 163, 175, 1))
            Font: =Font.'Open Sans'
            FontWeight: =If(varTimeStep >= 4, FontWeight.Semibold, FontWeight.Normal)
            Height: =20
            Size: =9
            Text: |-
              =If(varTimeStep >= 4, "🎉 Delivered!", "Tracking — step " & Min(varTimeStep, 4) & " of 4")
            Width: =Parent.Width - 40
            X: =20
            Y: =350
      - btnTimeNext:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(59, 130, 246, 1)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(varTimeStep >= 4, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(59, 130, 246, 1)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =RGBA(59, 130, 246, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(59, 130, 246, 1), -15%)
            OnSelect: =Set(varTimeStep, Min(4, varTimeStep + 1))
            PressedBorderColor: =RGBA(59, 130, 246, 1)
            PressedFill: =ColorFade(RGBA(59, 130, 246, 1), -30%)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: =If(varTimeStep >= 4, "Done", "Next Step")
            Width: =110
            X: =20
            Y: =382
      - btnTimeUndo:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(75, 85, 99, 1)
            BorderThickness: =1
            Color: =RGBA(209, 213, 219, 1)
            DisplayMode: =If(varTimeStep <= 1, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(30, 41, 56, 1)
            FocusedBorderThickness: =1
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =RGBA(107, 114, 128, 1)
            HoverColor: =RGBA(243, 244, 246, 1)
            HoverFill: =RGBA(55, 65, 81, 1)
            OnSelect: =Set(varTimeStep, Max(1, varTimeStep - 1))
            PressedBorderColor: =RGBA(107, 114, 128, 1)
            PressedFill: =RGBA(30, 41, 56, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: ="Undo"
            Width: =90
            X: =140
            Y: =382
      - btnTimeReset:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(252, 165, 165, 1)
            BorderThickness: =1
            Color: =RGBA(248, 113, 113, 1)
            Fill: =RGBA(30, 41, 56, 1)
            FocusedBorderThickness: =1
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =RGBA(248, 113, 113, 1)
            HoverColor: =RGBA(252, 165, 165, 1)
            HoverFill: =RGBA(69, 26, 26, 1)
            OnSelect: =Set(varTimeStep, 1)
            PressedBorderColor: =RGBA(248, 113, 113, 1)
            PressedFill: =RGBA(30, 41, 56, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: ="Reset"
            Width: =90
            X: =240
            Y: =382
