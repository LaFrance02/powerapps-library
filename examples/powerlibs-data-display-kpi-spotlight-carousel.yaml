- conKpiSpotlight:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(75, 85, 99, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(31, 41, 55, 1)
      Height: =240
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =360
      X: =40
      Y: =40
    Children:
      - lblKpiSpotlightMetric:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =20
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =9
            Text: |-
              =Switch(Coalesce(varKpiSpotlightIndex, 1), 1, "Open tickets", 2, "Inspections overdue", 3, "Stock accuracy")
            Width: =Parent.Width - 110
            X: =24
            Y: =24
      - lblKpiSpotlightValue:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =Switch(Coalesce(varKpiSpotlightIndex, 1), 1, ColorValue("#3B82F6"), 2, ColorValue("#F59E0B"), 3, ColorValue("#10B981"))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =60
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =32
            Text: |-
              =Switch(Coalesce(varKpiSpotlightIndex, 1), 1, "14", 2, "3", 3, "97%")
            Width: =Parent.Width - 48
            X: =24
            Y: =52
      - lblKpiSpotlightContext:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =20
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =9
            Text: |-
              =Switch(Coalesce(varKpiSpotlightIndex, 1), 1, "3 waiting longer than a day", 2, "Oldest due since Monday", 3, "Last count 26 August")
            Width: =Parent.Width - 48
            X: =24
            Y: =120
      - btnKpiSpotlightPause:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =RGBA(156, 163, 175, 1)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            Height: =22
            HoverColor: =RGBA(243, 244, 246, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: =Set(varKpiSpotlightPaused, !varKpiSpotlightPaused)
            PressedColor: =RGBA(243, 244, 246, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =8
            Text: =If(varKpiSpotlightPaused, "Play", "Pause")
            Width: =60
            X: =Parent.Width - 76
            Y: =16
      - btnKpiSpotlightDot1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Fill: =If(Coalesce(varKpiSpotlightIndex, 1) = 1, Switch(Coalesce(varKpiSpotlightIndex, 1), 1, ColorValue("#3B82F6"), 2, ColorValue("#F59E0B"), 3, ColorValue("#10B981")), RGBA(75, 85, 99, 1))
            FocusedBorderThickness: =0
            Height: =10
            HoverFill: =Self.Fill
            OnSelect: =Set(varKpiSpotlightIndex, 1)
            PressedFill: =Self.Fill
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Text: =""
            Width: =10
            X: =24
            Y: =Parent.Height - 36
      - btnKpiSpotlightDot2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Fill: =If(Coalesce(varKpiSpotlightIndex, 1) = 2, Switch(Coalesce(varKpiSpotlightIndex, 1), 1, ColorValue("#3B82F6"), 2, ColorValue("#F59E0B"), 3, ColorValue("#10B981")), RGBA(75, 85, 99, 1))
            FocusedBorderThickness: =0
            Height: =10
            HoverFill: =Self.Fill
            OnSelect: =Set(varKpiSpotlightIndex, 2)
            PressedFill: =Self.Fill
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Text: =""
            Width: =10
            X: =42
            Y: =Parent.Height - 36
      - btnKpiSpotlightDot3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Fill: =If(Coalesce(varKpiSpotlightIndex, 1) = 3, Switch(Coalesce(varKpiSpotlightIndex, 1), 1, ColorValue("#3B82F6"), 2, ColorValue("#F59E0B"), 3, ColorValue("#10B981")), RGBA(75, 85, 99, 1))
            FocusedBorderThickness: =0
            Height: =10
            HoverFill: =Self.Fill
            OnSelect: =Set(varKpiSpotlightIndex, 3)
            PressedFill: =Self.Fill
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Text: =""
            Width: =10
            X: =60
            Y: =Parent.Height - 36
      - icoKpiSpotlightPrev:
          Control: Classic/Icon@2.5.0
          Properties:
            FocusedBorderThickness: =0
            Color: =RGBA(156, 163, 175, 1)
            Height: =26
            Icon: =Icon.ChevronLeft
            OnSelect: =Set(varKpiSpotlightIndex, Mod(Coalesce(varKpiSpotlightIndex, 1) + 1, 3) + 1)
            Width: =26
            X: =Parent.Width - 84
            Y: =Parent.Height - 44
      - icoKpiSpotlightNext:
          Control: Classic/Icon@2.5.0
          Properties:
            FocusedBorderThickness: =0
            Color: =RGBA(156, 163, 175, 1)
            Height: =26
            Icon: =Icon.ChevronRight
            OnSelect: =Set(varKpiSpotlightIndex, Mod(Coalesce(varKpiSpotlightIndex, 1), 3) + 1)
            Width: =26
            X: =Parent.Width - 50
            Y: =Parent.Height - 44
      - tmrKpiSpotlight:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =5000
            Height: =40
            OnTimerEnd: |-
              =If(!varKpiSpotlightPaused,
                  Set(varKpiSpotlightIndex, Mod(Coalesce(varKpiSpotlightIndex, 1), 3) + 1)
              )
            Repeat: =true
            Visible: =false
            Width: =120
            X: =20
            Y: =Parent.Height - 46
