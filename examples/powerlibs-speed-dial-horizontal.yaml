- btnHorizontalDialScrim:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      BorderStyle: =BorderStyle.None
      BorderThickness: =0
      Color: =RGBA(0, 0, 0, 0)
      Fill: =RGBA(0, 0, 0, 0)
      FocusedBorderThickness: =0
      Height: =Parent.Height
      HoverBorderColor: =RGBA(0, 0, 0, 0)
      HoverColor: =RGBA(0, 0, 0, 0)
      HoverFill: =RGBA(0, 0, 0, 0)
      OnSelect: =Set(varHorizontalDialOpen, false); Set(varHorizontalDialRun, Text(Now(), "yyyymmddhhmmssfff"))
      PressedBorderColor: =RGBA(0, 0, 0, 0)
      PressedColor: =RGBA(0, 0, 0, 0)
      PressedFill: =RGBA(0, 0, 0, 0)
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Text: =""
      Visible: =varHorizontalDialOpen
      Width: =Parent.Width
      X: =0
      Y: =0
- conHorizontalDialAction1:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(21, 30, 48, 1)
      Height: =44
      RadiusBottomLeft: =22
      RadiusBottomRight: =22
      RadiusTopLeft: =22
      RadiusTopRight: =22
      Visible: =varHorizontalDialOpen
      Width: =44
      X: =Parent.Width - 80 - 56 + 6
      Y: =Parent.Height - 80 + 6
    Children:
      - icoHorizontalDialAction1Icon:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(230, 234, 242, 1)
            Height: =22
            Icon: =Icon.Document
            PaddingBottom: =2
            PaddingLeft: =2
            PaddingRight: =2
            PaddingTop: =2
            Width: =22
            X: =(Parent.Width - 22) / 2
            Y: =(Parent.Height - 22) / 2
      - btnHorizontalDialAction1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(255, 255, 255, 0.08)
            OnSelect: |-
              =// New request: put your action here, for example Navigate(NewRequestScreen)
              Set(varHorizontalDialOpen, false); Set(varHorizontalDialRun, Text(Now(), "yyyymmddhhmmssfff"))
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(255, 255, 255, 0.14)
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            RadiusTopLeft: =22
            RadiusTopRight: =22
            Text: =""
            Tooltip: ="New request"
            Width: =Parent.Width
            X: =0
            Y: =0
