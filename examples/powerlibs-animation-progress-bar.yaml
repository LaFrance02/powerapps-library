- conProgressBar:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Height: =98
      Width: =400
      X: =(Parent.Width - Self.Width) / 2
      Y: =(Parent.Height - Self.Height) / 2
    Children:
      - tmrProgressBar:
          Control: Timer@2.1.0
          Properties:
            Duration: =3000
            OnTimerEnd: =Set(varBarRunning, false)
            Repeat: =false
            Start: =varBarRunning
            Visible: =false
      - imgProgressBar:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Height: =42
            Image: |-
              ="data:image/svg+xml;utf8, " & EncodeUrl(
                If(Coalesce(varBarRun, 0) = 0,
                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 42' width='100%' height='100%' font-family='Open Sans, Segoe UI, sans-serif' font-size='15' font-weight='600'>" & "<rect x='0' y='32' width='400' height='10' rx='5' fill='#22304A'/>" & "<text x='0' y='18' fill='#E6EAF2'>Ready</text>" & "<text x='400' y='18' text-anchor='end' fill='#8B99B0'>0%</text>" & "</svg>",
                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 42' width='100%' height='100%' font-family='Open Sans, Segoe UI, sans-serif' font-size='15' font-weight='600'>" & "<g id='run" & Coalesce(varBarRun, 0) & "'>" & "<rect x='0' y='32' width='400' height='10' rx='5' fill='#22304A'/>" & "<rect x='0' y='32' width='0' height='10' rx='5' fill='#3B82F6'><animate attributeName='width' from='0' to='400' dur='3s' fill='freeze' calcMode='spline' keySplines='0.33 1 0.68 1' keyTimes='0;1'/><set attributeName='fill' to='#22C55E' begin='3s' fill='freeze'/></rect>" & "<text x='0' y='18' fill='#E6EAF2'>Uploading files<set attributeName='opacity' to='0' begin='3s' fill='freeze'/></text><text x='0' y='18' fill='#E6EAF2' opacity='0'>Done<set attributeName='opacity' to='1' begin='3s' fill='freeze'/></text>" & Concat(Sequence(90), "<text x='400' y='18' text-anchor='end' fill='#8B99B0' opacity='0'>" & Round(100 * (1 - Power(1 - Value / 90, 3)), 0) & "%<set attributeName='opacity' to='1' begin='" & Text((Value - 1) * 0.0333, "0.0000", "en-US") & "s'" & If(Value = 90, " fill='freeze'", " dur='0.0333s'") & "/></text>") & "</g></svg>"
                )
              )
            Width: =Parent.Width
            X: =0
            Y: =0
      - btnBarStart:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =ColorFade(RGBA(59, 130, 246, 1), 40%)
            DisplayMode: =If(varBarRunning, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(59, 130, 246, 1)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(59, 130, 246, 1), -15%)
            OnSelect: |-
              =Set(varBarRun, Coalesce(varBarRun, 0) + 1);
              Set(varBarRunning, true)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =ColorFade(RGBA(59, 130, 246, 1), -30%)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =12
            Text: =If(varBarRunning, "Working", If(Coalesce(varBarRun, 0) > 0, "Run again", "Start upload"))
            Width: =140
            X: =0
            Y: =58
