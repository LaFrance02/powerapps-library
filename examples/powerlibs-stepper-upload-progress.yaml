- conAnimBarSection:
    Control: GroupContainer@1.4.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(30, 41, 56, 1)
      Height: =210
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =Parent.Width - 80
    Children:
      - lblAnimTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(243, 244, 246, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="Animated Upload Progress"
            Width: =300
            X: =20
            Y: =16
      - lblAnimPercent:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =If(varAnimProg >= 100, RGBA(34, 197, 94, 1), RGBA(59, 130, 246, 1))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =28
            Size: =14
            Text: =Round(varAnimProg, 0) & "%"
            Width: =80
            X: =Parent.Width - 100
            Y: =16
      - lblAnimStatus:
          Control: Label@2.5.1
          Properties:
            Color: =If(varAnimProg >= 100, RGBA(34, 197, 94, 1), RGBA(156, 163, 175, 1))
            Font: =Font.'Open Sans'
            Height: =20
            Size: =9
            Text: |-
              =If(varAnimProg >= 100, "✓ Upload complete!",
                If(varAnimRunning, "Uploading... " & Round(varAnimProg, 0) & "% of 100%",
                If(varAnimProg > 0, "Paused at " & Round(varAnimProg, 0) & "%",
                "Ready to upload")))
            Width: =Parent.Width - 40
            X: =20
            Y: =48
      - conAnimTrack:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(75, 85, 99, 1)
            Height: =12
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Width: =Parent.Width - 40
            X: =20
            Y: =78
          Children:
            - conAnimFill:
                Control: GroupContainer@1.4.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =If(varAnimProg >= 100, RGBA(34, 197, 94, 1), RGBA(59, 130, 246, 1))
                  Height: =Parent.Height
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Width: =Max(0, Parent.Width * Min(varAnimProg, 100) / 100)
      - lblAnimBytes:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =18
            Size: =8
            Text: =Round(varAnimProg * 2.56, 1) & " MB / 256 MB"
            Width: =200
            X: =20
            Y: =96
      - btnAnimStart:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(varAnimProg >= 100, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =If(varAnimRunning, RGBA(245, 158, 11, 1), RGBA(59, 130, 246, 1))
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: =Set(varAnimRunning, !varAnimRunning)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =ColorFade(Self.Fill, -30%)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: =If(varAnimRunning, "Pause", If(varAnimProg >= 100, "Done", "Start Upload"))
            Width: =120
            X: =20
            Y: =124
      - btnAnimReset:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(252, 165, 165, 1)
            BorderThickness: =1
            Color: =RGBA(248, 113, 113, 1)
            Fill: =RGBA(30, 41, 56, 1)
            FocusedBorderThickness: =1
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =RGBA(248, 113, 113, 1)
            HoverColor: =RGBA(252, 165, 165, 1)
            HoverFill: =RGBA(69, 26, 26, 1)
            OnSelect: |-
              =Set(varAnimProg, 0);
              Set(varAnimRunning, false)
            PressedBorderColor: =RGBA(248, 113, 113, 1)
            PressedFill: =RGBA(30, 41, 56, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: ="Reset"
            Width: =90
            X: =150
            Y: =124
      - AnimTimer:
          Control: Timer@2.1.0
          Properties:
            Duration: =50
            OnTimerEnd: |-
              =If(varAnimProg < 100,
                  Set(varAnimProg, Min(100, varAnimProg + 1.25)),
                  Set(varAnimRunning, false)
              )
            Repeat: =true
            Start: =varAnimRunning
            Visible: =false
