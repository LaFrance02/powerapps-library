- conSuccessCheck:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Height: =208
      Width: =240
      X: =(Parent.Width - Self.Width) / 2
      Y: =(Parent.Height - Self.Height) / 2
    Children:
      - imgSuccessMark:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Height: =96
            Image: |-
              ="data:image/svg+xml;utf8, " & EncodeUrl(
                "<svg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'>" &
                "<g id='run" & Coalesce(varSuccessCount, 0) & "'>" &
                "<circle cx='50' cy='50' r='45' fill='#22C55E' opacity='0'><animate attributeName='opacity' from='0' to='0.12' dur='0.4s' begin='0.28s' fill='freeze' /></circle>" &
                "<circle cx='50' cy='50' r='45' stroke='#22C55E' stroke-width='6' fill='none' stroke-linecap='round' transform='rotate(-90 50 50)' stroke-dasharray='283' stroke-dashoffset='283'>" &
                "<animate attributeName='stroke-dashoffset' from='283' to='0' dur='0.48s' fill='freeze' calcMode='spline' keySplines='0.4 0 0.2 1' keyTimes='0;1' /></circle>" &
                "<path d='M30 52 L45 66 L72 38' stroke='#22C55E' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='60' stroke-dashoffset='60'>" &
                "<animate attributeName='stroke-dashoffset' from='60' to='0' dur='0.32s' begin='0.40s' fill='freeze' calcMode='spline' keySplines='0.4 0 0.2 1' keyTimes='0;1' /></path>" &
                "</g></svg>"
              )
            Visible: =varShowSuccess
            Width: =96
            X: =(Parent.Width - Self.Width) / 2
            Y: =0
      - lblSuccessMessage:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(230, 234, 242, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =28
            Size: =16
            Text: ="Saved"
            VerticalAlign: =VerticalAlign.Middle
            Visible: =varShowSuccess
            Width: =Parent.Width
            X: =0
            Y: =104
      - lblSuccessSub:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(139, 153, 176, 1)
            Font: =Font.'Open Sans'
            Height: =20
            Size: =11
            Text: ="Your changes are in."
            VerticalAlign: =VerticalAlign.Middle
            Visible: =varShowSuccess
            Width: =Parent.Width
            X: =0
            Y: =132
      - btnSuccessDemo:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(59, 130, 246, 1)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(59, 130, 246, 1), -15%)
            OnSelect: =Set(varSuccessCount, Coalesce(varSuccessCount, 0) + 1); Set(varShowSuccess, true)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =ColorFade(RGBA(59, 130, 246, 1), -30%)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =12
            Text: ="Save"
            Width: =140
            X: =(Parent.Width - Self.Width) / 2
            Y: =168
