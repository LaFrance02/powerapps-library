- conAssetCard:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(34, 48, 74, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(21, 30, 48, 1)
      Height: =409
      RadiusBottomLeft: =16
      RadiusBottomRight: =16
      RadiusTopLeft: =16
      RadiusTopRight: =16
      Width: =300
      X: =(Parent.Width - Self.Width) / 2
      Y: =(Parent.Height - Self.Height) / 2
    Children:
      - imgAssetPhoto:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Height: =195
            Image: =SampleImage
            ImagePosition: =ImagePosition.Fill
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =260
            X: =20
            Y: =20
      - conAssetStatus:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(21, 30, 48, 1)
            Height: =22
            RadiusBottomLeft: =11
            RadiusBottomRight: =11
            RadiusTopLeft: =11
            RadiusTopRight: =11
            Width: =96
            X: =32
            Y: =32
          Children:
            - lblAssetStatusText:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Center
                  FontColor: =RGBA(34, 197, 94, 1)
                  Height: =Parent.Height
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: ="Available"
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Semibold
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - lblAssetTag:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =18
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =11
            Text: ="IT-00421"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Semibold
            Width: =260
            X: =20
            Y: =227
      - lblAssetName:
          Control: Text@0.0.51
