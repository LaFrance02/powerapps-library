- conHorizontalStepper:
    Control: GroupContainer@1.4.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(30, 41, 56, 1)
      FillPortions: =0
      Height: =380
      LayoutMinHeight: =0
      LayoutMinWidth: =0
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =Parent.Width - 80
    Children:
      - lblHorizTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(243, 244, 246, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="Horizontal Stepper"
            Width: =Parent.Width - 40
            X: =20
            Y: =16
      - conStep1Circle:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =If(varHStep > 1, RGBA(34, 197, 94, 1), If(varHStep = 1, RGBA(59, 130, 246, 1), RGBA(75, 85, 99, 1)))
            Height: =36
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Width: =36
            X: =1 * (Parent.Width - 40) / 8 + 20 - 18
            Y: =60
          Children:
            - lblStep1Num:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(varHStep >= 1, RGBA(255, 255, 255, 1), RGBA(107, 114, 128, 1))
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.Height
                  Size: =10
                  Text: =If(varHStep > 1, "✓", "1")
                  Width: =Parent.Width
      - conLine1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =If(varHStep > 1, RGBA(34, 197, 94, 1), RGBA(75, 85, 99, 1))
            Height: =3
            Width: =(Parent.Width - 40) / 4 - 44
            X: =conStep1Circle.X + conStep1Circle.Width + 4
            Y: =conStep1Circle.Y + conStep1Circle.Height / 2 - 1
      - conStep2Circle:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =If(varHStep > 2, RGBA(34, 197, 94, 1), If(varHStep = 2, RGBA(59, 130, 246, 1), RGBA(75, 85, 99, 1)))
            Height: =36
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Width: =36
            X: =3 * (Parent.Width - 40) / 8 + 20 - 18
            Y: =60
          Children:
            - lblStep2Num:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(varHStep >= 2, RGBA(255, 255, 255, 1), RGBA(107, 114, 128, 1))
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.Height
                  Size: =10
                  Text: =If(varHStep > 2, "✓", "2")
                  Width: =Parent.Width
      - conLine2:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =If(varHStep > 2, RGBA(34, 197, 94, 1), RGBA(75, 85, 99, 1))
            Height: =3
            Width: =(Parent.Width - 40) / 4 - 44
            X: =conStep2Circle.X + conStep2Circle.Width + 4
            Y: =conStep2Circle.Y + conStep2Circle.Height / 2 - 1
      - conStep3Circle:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =If(varHStep > 3, RGBA(34, 197, 94, 1), If(varHStep = 3, RGBA(59, 130, 246, 1), RGBA(75, 85, 99, 1)))
            Height: =36
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Width: =36
            X: =5 * (Parent.Width - 40) / 8 + 20 - 18
            Y: =60
          Children:
            - lblStep3Num:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(varHStep >= 3, RGBA(255, 255, 255, 1), RGBA(107, 114, 128, 1))
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.Height
                  Size: =10
                  Text: =If(varHStep > 3, "✓", "3")
                  Width: =Parent.Width
      - conLine3:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =If(varHStep > 3, RGBA(34, 197, 94, 1), RGBA(75, 85, 99, 1))
            Height: =3
            Width: =(Parent.Width - 40) / 4 - 44
            X: =conStep3Circle.X + conStep3Circle.Width + 4
            Y: =conStep3Circle.Y + conStep3Circle.Height / 2 - 1
      - conStep4Circle:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =If(varHStep > 4, RGBA(34, 197, 94, 1), If(varHStep = 4, RGBA(59, 130, 246, 1), RGBA(75, 85, 99, 1)))
            Height: =36
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Width: =36
            X: =7 * (Parent.Width - 40) / 8 + 20 - 18
            Y: =60
          Children:
            - lblStep4Num:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(varHStep >= 4, RGBA(255, 255, 255, 1), RGBA(107, 114, 128, 1))
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.Height
                  Size: =10
                  Text: =If(varHStep > 4, "✓", "4")
                  Width: =Parent.Width
      - lblStep1Label:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =If(varHStep >= 1, RGBA(243, 244, 246, 1), RGBA(156, 163, 175, 1))
            Font: =Font.'Open Sans'
            FontWeight: =If(varHStep = 1, FontWeight.Semibold, FontWeight.Normal)
            Height: =20
            Size: =8
            Text: ="Account Info"
            Width: =120
            X: =conStep1Circle.X + conStep1Circle.Width / 2 - 60
            Y: =conStep1Circle.Y + conStep1Circle.Height + 6
      - lblStep2Label:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =If(varHStep >= 2, RGBA(243, 244, 246, 1), RGBA(156, 163, 175, 1))
            Font: =Font.'Open Sans'
            FontWeight: =If(varHStep = 2, FontWeight.Semibold, FontWeight.Normal)
            Height: =20
            Size: =8
            Text: ="Personal Details"
            Width: =120
            X: =conStep2Circle.X + conStep2Circle.Width / 2 - 60
            Y: =conStep2Circle.Y + conStep2Circle.Height + 6
      - lblStep3Label:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =If(varHStep >= 3, RGBA(243, 244, 246, 1), RGBA(156, 163, 175, 1))
            Font: =Font.'Open Sans'
            FontWeight: =If(varHStep = 3, FontWeight.Semibold, FontWeight.Normal)
            Height: =20
            Size: =8
            Text: ="Preferences"
            Width: =120
            X: =conStep3Circle.X + conStep3Circle.Width / 2 - 60
            Y: =conStep3Circle.Y + conStep3Circle.Height + 6
      - lblStep4Label:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =If(varHStep >= 4, RGBA(243, 244, 246, 1), RGBA(156, 163, 175, 1))
            Font: =Font.'Open Sans'
            FontWeight: =If(varHStep = 4, FontWeight.Semibold, FontWeight.Normal)
            Height: =20
            Size: =8
            Text: ="Review & Submit"
            Width: =120
            X: =conStep4Circle.X + conStep4Circle.Width / 2 - 60
            Y: =conStep4Circle.Y + conStep4Circle.Height + 6
      - conStepContent:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(75, 85, 99, 1)
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =RGBA(55, 65, 81, 1)
            Height: =160
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.Width - 40
            X: =20
            Y: =lblStep1Label.Y + lblStep1Label.Height + 16
          Children:
            - icoStepContentIcon:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(59, 130, 246, 1)
                  Height: =32
                  Icon: =If(varHStep = 1, Icon.Person, If(varHStep = 2, Icon.Edit, If(varHStep = 3, Icon.Settings, Icon.Check)))
                  Width: =32
                  X: =20
                  Y: =20
            - lblContentTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(243, 244, 246, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =11
                  Text: =If(varHStep = 1, "Account Information", If(varHStep = 2, "Personal Details", If(varHStep = 3, "Preferences", "Review & Submit")))
                  Width: =Parent.Width - 80
                  X: =60
                  Y: =20
            - lblContentDesc:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(107, 114, 128, 1)
                  Font: =Font.'Open Sans'
                  Size: =9
                  Text: =If(varHStep = 1, "Enter your email address and create a secure password to set up your account.", If(varHStep = 2, "Provide your full name, phone number, and date of birth.", If(varHStep = 3, "Choose your notification settings, language, and theme preferences.", "Review all the information you've entered and submit your registration.")))
                  Width: =Parent.Width - 80
                  X: =60
                  Y: =48
            - lblContentHint:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(156, 163, 175, 1)
                  Font: =Font.'Open Sans'
                  Height: =20
                  Size: =8
                  Text: |-
                    =If(varHStep = 1, "Required fields: Email, Password, Confirm Password",
                          If(varHStep = 2, "Required fields: First Name, Last Name, Phone",
                              If(varHStep = 3, "All preferences can be changed later in Settings",
                                  "Please verify all details before submitting")))
                  Width: =Parent.Width - 80
                  X: =60
                  Y: =92
      - btnHBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(75, 85, 99, 1)
            BorderThickness: =1
            Color: =RGBA(209, 213, 219, 1)
            DisplayMode: =If(varHStep <= 1, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(30, 41, 56, 1)
            FocusedBorderThickness: =1
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =RGBA(107, 114, 128, 1)
            HoverColor: =RGBA(243, 244, 246, 1)
            HoverFill: =RGBA(55, 65, 81, 1)
            OnSelect: =Set(varHStep, Max(1, varHStep - 1))
            PressedBorderColor: =RGBA(107, 114, 128, 1)
            PressedFill: =RGBA(30, 41, 56, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: ="Back"
            Width: =100
            X: =20
            Y: =conStepContent.Y + conStepContent.Height + 12
      - btnHNext:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(59, 130, 246, 1)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(59, 130, 246, 1)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =RGBA(59, 130, 246, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(59, 130, 246, 1), -15%)
            OnSelect: =Set(varHStep, Min(5, varHStep + 1))
            PressedBorderColor: =RGBA(59, 130, 246, 1)
            PressedFill: =ColorFade(RGBA(59, 130, 246, 1), -30%)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =10
            Text: =If(varHStep = 4, "Complete", "Next")
            Width: =100
            X: =Parent.Width - Self.Width - 20
            Y: =conStepContent.Y + conStepContent.Height + 12
      - lblHComplete:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(34, 197, 94, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =10
            Text: ="✓  All steps completed successfully!"
            Visible: =varHStep > 4
            Width: =Parent.Width - 40
            X: =20
            Y: =conStepContent.Y + conStepContent.Height + 16
