                          ="data:image/svg+xml," & EncodeUrl(
                              "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>
                                <style>
                                  .arrowMAINMENU_" & varAnimMAINMENU & " {
                                    stroke: #6366F1;
                                    stroke-width: 2;
                                    stroke-linecap: round;
                                    stroke-linejoin: round;
                                    fill: none;
                                    transform-origin: center;
                                    animation-name: rotateArrowMAINMENU_" & varAnimMAINMENU & ";
                                    animation-duration: " & If(IsBlank(varAnimMAINMENU), "0ms", "300ms") & ";
                                    animation-fill-mode: both;
                                    animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
                                  }
                                  @keyframes rotateArrowMAINMENU_" & varAnimMAINMENU & " {
                                    " & If(varExpandMAINMENU, "0%", "100%") & " {
                                      transform: rotate(0deg);
                                    }
                                    " & If(varExpandMAINMENU, "100%", "0%") & " {
                                      transform: rotate(180deg);
                                    }
                                  }
                                </style>
                                <path class='arrowMAINMENU_" & varAnimMAINMENU & "' d='m6 9 6 6 6-6' />
                              </svg>"
                          )
