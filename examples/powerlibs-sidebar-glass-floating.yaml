                        Height: =Parent.Height
                        HoverFill: =RGBA(0, 0, 0, 0)
                        OnSelect: |-
                          =Set(varExpandMAINMENU, !varExpandMAINMENU);
                          Set(varAnimMAINMENU, Text(Now(), "yyyymmddhhmmssfff"))
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Text: =""
                        Width: =Parent.Width
            - galMAINMENUItems:
