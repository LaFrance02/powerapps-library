- conPillTabs:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =40
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Width: =Min(330, Parent.Width - 80)
      X: =40
      Y: =40
    Children:
      - conPillTabsTrack:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(34, 48, 74, 1)
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =RGBA(11, 18, 32, 1)
            Height: =40
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Width: =Parent.Width
            X: =0
            Y: =0
      - imgPillTabsIndicator:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Height: =40
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 40' preserveAspectRatio='none'><g id='r" & Coalesce(varPillTabsRun, "0") & "'><rect y='3' width='94' height='34' rx='17' fill='#3B82F6'><animate attributeName='x' from='" & Text((Coalesce(varPillTabsPrev, 1) - 1) * 100 + 3) & "' to='" & Text((Coalesce(varPillTabs, 1) - 1) * 100 + 3) & "' dur='" & If(IsBlank(varPillTabsRun), "1ms", "220ms") & "' fill='freeze' calcMode='spline' keySplines='0.2 0 0 1'/></rect></g></svg>")
            ImagePosition: =ImagePosition.Stretch
            Width: =Parent.Width
            X: =0
            Y: =0
      - btnPillTabsTab1:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =If(Coalesce(varPillTabs, 1) = 1, RGBA(255, 255, 255, 1), RGBA(139, 153, 176, 1))
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =If(Coalesce(varPillTabs, 1) = 1, RGBA(255, 255, 255, 1), RGBA(230, 234, 242, 1))
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: |-
              =UpdateContext({ varPillTabsPrev: Coalesce(varPillTabs, 1), varPillTabs: 1, varPillTabsRun: Text(Now(), "yyyymmddhhmmssfff") })
            PaddingLeft: =4
            PaddingRight: =4
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: ="Monthly"
            Width: =Parent.Width / 3
            X: =Parent.Width * 0 / 3
            Y: =0
      - btnPillTabsTab2:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =If(Coalesce(varPillTabs, 1) = 2, RGBA(255, 255, 255, 1), RGBA(139, 153, 176, 1))
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =If(Coalesce(varPillTabs, 1) = 2, RGBA(255, 255, 255, 1), RGBA(230, 234, 242, 1))
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: |-
              =UpdateContext({ varPillTabsPrev: Coalesce(varPillTabs, 1), varPillTabs: 2, varPillTabsRun: Text(Now(), "yyyymmddhhmmssfff") })
            PaddingLeft: =4
            PaddingRight: =4
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: ="Quarterly"
            Width: =Parent.Width / 3
            X: =Parent.Width * 1 / 3
            Y: =0
      - btnPillTabsTab3:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =If(Coalesce(varPillTabs, 1) = 3, RGBA(255, 255, 255, 1), RGBA(139, 153, 176, 1))
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =If(Coalesce(varPillTabs, 1) = 3, RGBA(255, 255, 255, 1), RGBA(230, 234, 242, 1))
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: |-
              =UpdateContext({ varPillTabsPrev: Coalesce(varPillTabs, 1), varPillTabs: 3, varPillTabsRun: Text(Now(), "yyyymmddhhmmssfff") })
            PaddingLeft: =4
            PaddingRight: =4
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: ="Yearly"
            Width: =Parent.Width / 3
            X: =Parent.Width * 2 / 3
            Y: =0
