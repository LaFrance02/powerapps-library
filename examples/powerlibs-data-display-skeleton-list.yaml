- conSkeletonList:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =148
      Width: =280
      X: =40
      Y: =40
    Children:
      - SkeletonListPulse:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =1400
            Height: =40
            Repeat: =true
            Visible: =false
            Width: =40
            X: =0
            Y: =0
      - conSkeletonListAvatar1:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(55, 65, 81, 0.35 + 0.45 * Sin(Pi() * SkeletonListPulse.Value / SkeletonListPulse.Duration))
            Height: =36
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
