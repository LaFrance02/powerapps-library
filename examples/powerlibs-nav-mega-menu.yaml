                                    stroke: " & If(varActiveNav = "Products", "#60A5FA", "#9CA3AF") & ";
                                    stroke-width: 2;
                                    stroke-linecap: round;
                                    stroke-linejoin: round;
                                    fill: none;
                                    transform-origin: center;
                                    animation-name: rotateArrowProducts_" & varAnimProducts & ";
                                    animation-duration: " & If(IsBlank(varAnimProducts), "0ms", "300ms") & ";
                                    animation-fill-mode: both;
                                  }
                                  @keyframes rotateArrowProducts_" & varAnimProducts & " {
                                    " & If(varActiveNav = "Products", "0%", "100%") & " {
                                      transform: rotate(0deg);
                                    }
                                    " & If(varActiveNav = "Products", "100%", "0%") & " {
                                      transform: rotate(180deg);
                                    }
                                  }
                                </style>
                                <path class='arrowProducts_" & varAnimProducts & "' d='m6 9 6 6 6-6' />
                              </svg>"
                          )
