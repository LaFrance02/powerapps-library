- conGroup:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(60, 75, 105, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(21, 30, 48, 1)
      Height: =40
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Width: =283
      X: =40
      Y: =40
    Children:
      - btnGroup1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =If(Coalesce(varButtonGroup, 1) = 1, RGBA(59, 130, 246, 1), RGBA(180, 190, 206, 1))
            Fill: =If(Coalesce(varButtonGroup, 1) = 1, RGBA(59, 130, 246, 0.12), RGBA(0, 0, 0, 0))
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =If(Coalesce(varButtonGroup, 1) = 1, RGBA(59, 130, 246, 1), RGBA(230, 234, 242, 1))
            HoverFill: =If(Coalesce(varButtonGroup, 1) = 1, RGBA(59, 130, 246, 0.12), RGBA(255, 255, 255, 0.06))
            OnSelect: |-
              =UpdateContext({ varButtonGroup: 1 })
              // Then your action for "List", or read varButtonGroup elsewhere
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(59, 130, 246, 1)
            PressedFill: =RGBA(59, 130, 246, 0.12)
            RadiusBottomLeft: =9
            RadiusBottomRight: =0
            RadiusTopLeft: =9
            RadiusTopRight: =0
            Size: =11
            Text: ="List"
            Width: =79
            X: =0
            Y: =0
