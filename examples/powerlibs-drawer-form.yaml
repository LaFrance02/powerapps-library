- btnOpenFormDrawer:
    Control: Button@0.0.45
    Properties:
      Appearance: ='ButtonCanvas.Appearance'.Primary
      BasePaletteColor: =RGBA(59, 130, 246, 1)
      Height: =40
      OnSelect: |-
        =UpdateContext({ varShowFormDrawer: true })
      Text: ="New expense claim"
      Width: =180
      X: =24
      Y: =24
- recFormDrawerScrim:
    Control: Rectangle@2.3.0
    Properties:
      BorderThickness: =0
      Fill: =RGBA(11, 18, 32, 0.55)
      Height: =Parent.Height
      HoverFill: =RGBA(11, 18, 32, 0.55)
      OnSelect: |-
        =UpdateContext({ varShowFormDrawer: false })
      PressedFill: =RGBA(11, 18, 32, 0.55)
      Tooltip: ="Close"
      Visible: =varShowFormDrawer
      Width: =Parent.Width
      X: =0
      Y: =0
- conFormDrawer:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(21, 30, 48, 1)
      Height: =Parent.Height
      RadiusBottomLeft: =If(Self.Width >= Parent.Width, 0, 16)
      RadiusBottomRight: =0
      RadiusTopLeft: =If(Self.Width >= Parent.Width, 0, 16)
      RadiusTopRight: =0
      Visible: =varShowFormDrawer
      Width: =Min(420, Parent.Width)
      X: =Parent.Width - Self.Width
      Y: =0
    Children:
      - lblFormDrawerTitle:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =31
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =19
            Text: ="New expense claim"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Bold
            Width: =Parent.Width - 88
            X: =24
            Y: =20
      - lblFormDrawerDescription:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =21
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =13
            Text: ="Fill in the details and save. Your manager is notified."
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =Parent.Width - 88
            X: =24
            Y: =46
      - imgFormDrawerClose:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            FocusedBorderThickness: =0
            Height: =16
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#8b99b0" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18 6 6 18 M6 6l12 12'/></svg>")
            ImagePosition: =ImagePosition.Fit
            OnSelect: |-
              =UpdateContext({ varShowFormDrawer: false })
            Width: =16
            X: =Parent.Width - 56 + 8
            Y: =28
      - conFormDrawerHeaderRule:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(34, 48, 74, 1)
            Height: =1
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            X: =0
            Y: =80
      - lblFormField1Label:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =20
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: ="Title"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Semibold
            Width: =Parent.Width - 48
            X: =24
            Y: =92
      - txtFormField1:
          Control: TextInput@0.0.54
          Properties:
            BorderColor: =RGBA(60, 75, 105, 1)
            BorderThickness: =1
            Fill: =RGBA(21, 30, 48, 1)
            Font: =Font.'Open Sans'
            Height: =40
            Placeholder: ="What was it for?"
            Value: =""
            Width: =Parent.Width - 48
            X: =24
            Y: =114
      - lblFormField2Label:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =20
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: ="Amount"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Semibold
            Width: =Parent.Width - 48
            X: =24
            Y: =170
      - txtFormField2:
          Control: TextInput@0.0.54
          Properties:
            BorderColor: =RGBA(60, 75, 105, 1)
            BorderThickness: =1
            Fill: =RGBA(21, 30, 48, 1)
            Font: =Font.'Open Sans'
            Height: =40
            Placeholder: ="0.00"
            Value: =""
            Width: =Parent.Width - 48
            X: =24
            Y: =192
      - lblFormField3Label:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =20
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: ="Category"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Semibold
            Width: =Parent.Width - 48
            X: =24
            Y: =248
      - txtFormField3:
          Control: DropDown@0.0.45
          Properties:
            BorderColor: =RGBA(60, 75, 105, 1)
            BorderThickness: =1
            Fill: =RGBA(21, 30, 48, 1)
            Height: =40
            Items: =["Travel", "Meals", "Equipment", "Software", "Other"]
            Width: =Parent.Width - 48
            X: =24
            Y: =270
      - lblFormField4Label:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =20
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: ="Date"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Semibold
            Width: =Parent.Width - 48
            X: =24
            Y: =326
      - txtFormField4:
          Control: DatePicker@0.0.46
          Properties:
            BorderColor: =RGBA(60, 75, 105, 1)
            BorderThickness: =1
            Fill: =RGBA(21, 30, 48, 1)
            Height: =40
            Width: =Parent.Width - 48
            X: =24
            Y: =348
      - lblFormField5Label:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =20
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: ="Notes"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Semibold
            Width: =Parent.Width - 48
            X: =24
            Y: =404
      - txtFormField5:
          Control: TextInput@0.0.54
          Properties:
            BorderColor: =RGBA(60, 75, 105, 1)
            BorderThickness: =1
            Fill: =RGBA(21, 30, 48, 1)
            Font: =Font.'Open Sans'
            Height: =96
            Mode: ='TextInputCanvas.Mode'.Multiline
            Placeholder: ="Anything your manager should know"
            Value: =""
            Width: =Parent.Width - 48
            X: =24
            Y: =426
      - conFormDrawerFooterRule:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(34, 48, 74, 1)
            Height: =1
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - 80
      - btnFormDrawerSecondary:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Outline
            Height: =44
            OnSelect: |-
              =UpdateContext({ varShowFormDrawer: false })
            Text: ="Cancel"
            Width: =120
            X: =24
            Y: =Parent.Height - 62
      - btnFormDrawerPrimary:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Primary
            BasePaletteColor: =RGBA(59, 130, 246, 1)
            Height: =44
            OnSelect: |-
              =UpdateContext({ varShowFormDrawer: false })
            Text: ="Save claim"
            Width: =150
            X: =Parent.Width - 24 - Self.Width
            Y: =Parent.Height - 62