- conNavbar:
    Control: GroupContainer@1.4.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(30, 41, 56, 1)
      Height: =50
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Width: =Parent.Width
    Children:
      - imgLogo:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(55, 65, 81, 1)
            Height: =50
            Image: =SampleImage
            Width: =40
            X: =14
      - lblTitle:
          Control: Text@0.0.51
          Properties:
            Height: =50
            Size: =14
            Text: ="Project Name"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Bold
            Width: =200
            X: =64
      - imgUserProfilePicture:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="User Profile Picture"
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =1
            Height: =35
            Image: =User().Image
            ImagePosition: =ImagePosition.Fill
            RadiusBottomLeft: =25
            RadiusBottomRight: =25
            RadiusTopLeft: =25
            RadiusTopRight: =25
            Width: =35
            X: =Parent.Width - Self.Width - 15
            Y: =7
