- lblBarChartTitle:
    Control: Label@2.5.1
    Properties:
      Color: =RGBA(255, 255, 255, 1)
      Font: =Font.'Open Sans'
      FontWeight: =FontWeight.Semibold
      Height: =20
      PaddingBottom: =0
      PaddingLeft: =0
      PaddingTop: =0
      Size: =11
      Text: ="Requests by day"
      Width: =360
      X: =40
      Y: =54

- galBarChart:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Flexible_SocialFeed_ver5.0
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      Height: =174
      Items: |-
        =Table({ Label: "Monday", Value: 42 }, { Label: "Tuesday", Value: 68 }, { Label: "Wednesday", Value: 31 }, { Label: "Thursday", Value: 75 }, { Label: "Friday", Value: 54 })
      ShowScrollbar: =false
      TemplatePadding: =2
      TemplateSize: =32
      Width: =360
      X: =40
      Y: =80
    Children:
      - lblBarLabel:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(209, 213, 219, 1)
            Font: =Font.'Open Sans'
            Height: =32
            PaddingLeft: =0
            Size: =10
            Text: =ThisItem.Label
            Width: =82
            X: =0
            Y: =0
      - conBarTrack:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(55, 65, 81, 1)
            Height: =14
            RadiusBottomLeft: =7
            RadiusBottomRight: =7
            RadiusTopLeft: =7
            RadiusTopRight: =7
            Width: =216
            X: =90
            Y: =(32 - Self.Height) / 2
      - conBar:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(59, 130, 246, 1)
            Height: =14
            RadiusBottomLeft: =7
            RadiusBottomRight: =7
            RadiusTopLeft: =7
            RadiusTopRight: =7
            Width: =Min(ThisItem.Value / 75, 1) * 216
            X: =90
            Y: =(32 - Self.Height) / 2
      - lblBarValue:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =32
            PaddingRight: =0
            Size: =10
            Text: =Text(ThisItem.Value)
            Width: =46
            X: =314
            Y: =0
