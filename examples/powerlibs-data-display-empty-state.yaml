- conEmptyState:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(0, 0, 0, 0)
      Height: =196
      Visible: =true
      Width: =320
      X: =40
      Y: =80
    Children:
      - icoEmptyStateIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(75, 85, 99, 1)
            Height: =44
            Icon: =Icon.Items
            Width: =44
            X: =(320 - Self.Width) / 2
            Y: =8
      - lblEmptyStateHeading:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(229, 231, 235, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            PaddingBottom: =0
            PaddingTop: =0
            Size: =13
            Text: ="Nothing here yet"
            Width: =320
            X: =0
            Y: =60
      - lblEmptyStateBody:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =36
            PaddingBottom: =0
            PaddingTop: =0
            Size: =10
            Text: ="Items you add will show up in this list."
            Width: =280
            X: =20
            Y: =84
      - btnEmptyStateAction:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(59, 130, 246, 1)
            FocusedBorderThickness: =1
            Font: =Font.'Open Sans'
            Height: =32
            HoverFill: =ColorFade(Self.Fill, -10%)
            PressedFill: =ColorFade(Self.Fill, -20%)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =11
            Text: ="Add the first one"
            Width: =150
            X: =(320 - Self.Width) / 2
            Y: =132
