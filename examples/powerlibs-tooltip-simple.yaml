- btnTooltipTrigger:
    Control: Classic/Button@2.2.0
    Group: grpSimpleTooltip
    Properties:
      BorderColor: =RGBA(55, 65, 81, 1)
      BorderThickness: =1
      Color: =RGBA(209, 213, 219, 1)
      Fill: =RGBA(31, 41, 55, 1)
      FocusedBorderThickness: =1
      Font: =Font.'Open Sans'
      Height: =32
      HoverBorderColor: =RGBA(75, 85, 99, 1)
      HoverColor: =RGBA(243, 244, 246, 1)
      HoverFill: =RGBA(55, 65, 81, 1)
      OnSelect: |-
        =UpdateContext({varTooltipVisible: !varTooltipVisible})
      PressedBorderColor: =RGBA(107, 114, 128, 1)
      PressedColor: =RGBA(255, 255, 255, 1)
      PressedFill: =RGBA(31, 41, 55, 1)
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =11
      Text: ="More Info"
      Width: =100
      X: =159
      Y: =105
- btnTooltipOverlay:
    Control: Classic/Button@2.2.0
    Group: grpSimpleTooltip
    Properties:
      FocusedBorderThickness: =0
      BorderStyle: =BorderStyle.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =Parent.Height
      HoverFill: =RGBA(0, 0, 0, 0)
      OnSelect: |-
        =UpdateContext({varTooltipVisible: false})
      PressedFill: =RGBA(0, 0, 0, 0)
      Text: =""
      Visible: =varTooltipVisible
      Width: =Parent.Width
- conTooltipBubble:
    Control: GroupContainer@1.4.0
    Variant: ManualLayout
    Group: grpSimpleTooltip
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(17, 24, 39, 0.95)
      Height: =lblTooltipText.Y + lblTooltipText.Height + 12
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Visible: =varTooltipVisible
      Width: =250
      X: =84
      Y: =29
    Children:
      - lblTooltipText:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            Size: =9
            Text: ="This is helpful context about this feature. Click anywhere outside to close this tooltip."
            Width: =Parent.Width
            Y: =12
