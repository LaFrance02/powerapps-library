- conRatingCard:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(75, 85, 99, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(31, 41, 55, 1)
      Height: =150
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =360
      X: =40
      Y: =40
    Children:
      - lblRatingLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(209, 213, 219, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            Text: ="How was your experience?"
            Width: =Parent.Width - 32
            X: =16
            Y: =18
      - rtgRating:
          Control: Rating
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Default: =0
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =36
            Max: =5
            RatingFill: =RGBA(59, 130, 246, 1)
            ReadOnly: =false
            ShowValue: =false
            Width: =200
            X: =16
            Y: =50
      - lblRatingValue:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =18
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =8
            Text: =If(rtgRating.Value >= 1, rtgRating.Value & " of " & rtgRating.Max, "Tap a star to rate")
            Width: =Parent.Width - 32
            X: =16
            Y: =100
