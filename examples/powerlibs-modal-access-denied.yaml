- btnAccessTrigger:
    Control: Button@0.0.45
    Properties:
      Appearance: ='ButtonCanvas.Appearance'.Primary
      BasePaletteColor: =RGBA(59, 130, 246, 1)
      Height: =40
      OnSelect: |-
        =UpdateContext({ varShowAccess: true })
      Text: ="Open admin area"
      Width: =160
      X: =40
      Y: =40
- btnAccessScrim:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =RGBA(0, 0, 0, 0)
      BorderStyle: =BorderStyle.None
      BorderThickness: =0
      Color: =RGBA(0, 0, 0, 0)
      Fill: =RGBA(11, 18, 32, 0.45)
      FocusedBorderThickness: =0
      Height: =Parent.Height
      HoverBorderColor: =RGBA(0, 0, 0, 0)
      HoverColor: =RGBA(0, 0, 0, 0)
      HoverFill: =RGBA(11, 18, 32, 0.45)
      OnSelect: |-
        =UpdateContext({ varShowAccess: false })
      PressedBorderColor: =RGBA(0, 0, 0, 0)
      PressedColor: =RGBA(0, 0, 0, 0)
      PressedFill: =RGBA(11, 18, 32, 0.45)
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Text: =""
      Tooltip: ="Close"
      Visible: =varShowAccess
      Width: =Parent.Width
      X: =0
      Y: =0
- conAccessPanel:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(21, 30, 48, 1)
      Height: =btnAccessRequest.Y + btnAccessRequest.Height + 24
      RadiusBottomLeft: =14
      RadiusBottomRight: =14
      RadiusTopLeft: =14
      RadiusTopRight: =14
      Visible: =varShowAccess
      Width: =Min(420, Parent.Width - 40)
      X: =(Parent.Width - Self.Width) / 2
      Y: =(Parent.Height - Self.Height) / 2
    Children:
      - conAccessBadge:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(239, 68, 68, 0.14)
            Height: =64
            RadiusBottomLeft: =32
            RadiusBottomRight: =32
            RadiusTopLeft: =32
            RadiusTopRight: =32
            Width: =64
            X: =(Parent.Width - 64) / 2
            Y: =28
          Children:
            - imgAccessBadgeIcon:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Height: =28
                  Image: |-
                    ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#ef4444" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z M7 11V7a5 5 0 0 1 10 0v4'/></svg>")
                  ImagePosition: =ImagePosition.Fit
                  Width: =28
                  X: =18
                  Y: =18
      - lblAccessTitle:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Center
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =32
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =20
            Text: ="You do not have access"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Bold
            Width: =Parent.Width - 48
            X: =24
            Y: =108
      - lblAccessDescription:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Center
            AutoHeight: =true
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =21
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =13
            Text: ="This area is for finance approvers. Your account is not in that group yet."
            VerticalAlign: =VerticalAlign.Top
            Weight: ='TextCanvas.Weight'.Regular
            Width: =Parent.Width - 48
            X: =24
            Y: =lblAccessTitle.Y + lblAccessTitle.Height + 6
      - conAccessDetails:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(11, 18, 32, 1)
            Height: =72
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.Width - 48
            X: =24
            Y: =lblAccessDescription.Y + lblAccessDescription.Height + 18
          Children:
            - lblAccessDetailsRow1:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Start
                  FontColor: =RGBA(180, 190, 206, 1)
                  Height: =22
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  Text: |-
                    ="Needed: Finance Approver role"
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: =Parent.Width - 28
                  X: =14
                  Y: =14
            - lblAccessDetailsRow2:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Start
                  FontColor: =RGBA(180, 190, 206, 1)
                  Height: =22
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  Text: |-
                    ="Ask: IT Service Desk"
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: =Parent.Width - 28
                  X: =14
                  Y: =36
      - btnAccessBack:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Outline
            Height: =44
            OnSelect: |-
              =UpdateContext({ varShowAccess: false }); Back()
            Text: ="Go back"
            Width: =(Parent.Width - 48 - 12) / 2
            X: =24
            Y: =conAccessDetails.Y + conAccessDetails.Height + 24
      - btnAccessRequest:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Primary
            BasePaletteColor: =RGBA(59, 130, 246, 1)
            Height: =44
            OnSelect: |-
              =// For example Launch("mailto:it@contoso.com?subject=Access request"), then close
              UpdateContext({ varShowAccess: false })
            Text: ="Request access"
            Width: =(Parent.Width - 48 - 12) / 2
            X: =btnAccessBack.X + btnAccessBack.Width + 12
            Y: =conAccessDetails.Y + conAccessDetails.Height + 24
      - imgAccessClose:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            FocusedBorderThickness: =0
            Height: =14
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='" & "#8b99b0" & "' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18 6 6 18 M6 6l12 12'/></svg>")
            ImagePosition: =ImagePosition.Fit
            OnSelect: |-
              =UpdateContext({ varShowAccess: false })
            Width: =14
            X: =Parent.Width - 44 + 9
            Y: =21
