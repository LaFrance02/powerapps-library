- conCountUp:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Height: =72
      Width: =240
      X: =(Parent.Width - Self.Width) / 2
      Y: =(Parent.Height - Self.Height) / 2
    Children:
      - imgCountUpNumber:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Height: =48
            Image: |-
              ="data:image/svg+xml;utf8, " & EncodeUrl(
                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 48' width='100%' height='100%' preserveAspectRatio='xMinYMid meet'>" &
                "<g id='run" & Coalesce(varCountRun, 0) & "' font-family='Open Sans, Segoe UI, sans-serif' font-size='32' font-weight='700' fill='#E6EAF2'>" &
                If(false,
                    "<text x='0' y='37'>$" & Text(0, "#,##0.00") & "</text>",
                    Concat(Sequence(60), "<text x='0' y='37' opacity='0'>$" & Text(Round(12480 * (1 - Power(1 - Value / 60, 3)), 2), "#,##0.00") & "<set attributeName='opacity' to='1' begin='" & Text((Value - 1) * 0.0333, "0.0000", "en-US") & "s'" & If(Value = 60, " fill='freeze'", " dur='0.0333s'") & "/></text>")
                ) &
                "</g></svg>"
              )
            Width: =Parent.Width - 32
            X: =0
            Y: =0
      - lblCountUpCaption:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(139, 153, 176, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            PaddingLeft: =0
            PaddingRight: =0
            Size: =12
            Text: ="Active users"
            VerticalAlign: =VerticalAlign.Middle
            Visible: =true
            Width: =Parent.Width
            X: =0
            Y: =48
      - icoCountUpReplay:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(139, 153, 176, 1)
            FocusedBorderThickness: =0
            Height: =24
            HoverColor: =RGBA(230, 234, 242, 1)
            Icon: =Icon.Reload
            OnSelect: =Set(varCountRun, Coalesce(varCountRun, 0) + 1)
            PaddingBottom: =4
            PaddingLeft: =4
            PaddingRight: =4
            PaddingTop: =4
            Tooltip: ="Count again"
            Width: =24
            X: =Parent.Width - Self.Width
            Y: =12
