- conDropdownHours:
    Control: GroupContainer@1.4.0
    Variant: ManualLayout
    Group: Time Picker
    Properties:
      DropShadow: =DropShadow.None
      Height: =40
      RadiusBottomLeft: =5
      RadiusBottomRight: =5
      RadiusTopLeft: =5
      RadiusTopRight: =5
      Width: =70
      X: =504
      Y: =212
    Children:
      - btnDropdownHoursBtn:
          Control: Classic/Button@2.2.0
          Properties:
            FocusedBorderThickness: =0
            Align: =Align.Left
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(55, 65, 81, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, -20%)
            HoverColor: =Self.Color
            HoverFill: =ColorFade(Self.Fill, -10%)
            OnSelect: |-
              =Set(varDropdownHours, !varDropdownHours);
              Set(varDropdownAnimTriggerHours, Text(Now(), "yyyymmddhhmmssfff"))
            PaddingLeft: =15
            PressedBorderColor: =ColorFade(Self.BorderColor, -40%)
            PressedFill: =ColorFade(Self.Fill, -20%)
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Size: =10
            Text: =If(!IsBlank(varDropdownHoursSelected), varDropdownHoursSelected, "00")
            Width: =Parent.Width
      - imgArrowHours:
          Control: Image@2.2.3
          Properties:
            FocusedBorderThickness: =0
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =15
            Image: |-
              ="data:image/svg+xml," & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='40px' height='40px'>
                    <style>
                      .arrowDropdown_" & varDropdownAnimTriggerHours & " {
                        stroke: white;
                        stroke-width: 1.5;
                        stroke-linecap: round;
                        stroke-linejoin: round;
                        fill: none;
                        transform-origin: center;
                        animation-name: rotateArrowDropdown_" & varDropdownAnimTriggerHours & ";
                        animation-duration: " & If(IsBlank(varDropdownAnimTriggerHours), "0ms", "400ms") & ";
                        animation-fill-mode: both;
                      }
                      @keyframes rotateArrowDropdown_" & varDropdownAnimTriggerHours & " {
                        " & If(varDropdownHours, "0%", "100%") & " {
                          transform: rotate(0deg);
                        }
                        " & If(varDropdownHours, "100%", "0%") & " {
                          transform: rotate(180deg);
                        }
                      }
                    </style>
                    <path class='arrowDropdown_" & varDropdownAnimTriggerHours & "' d='m4.5 15.75 7.5-7.5 7.5 7.5' />
                  </svg>"
              )
            OnSelect: |-
              =Set(varDropdownHours, !varDropdownHours);
              Set(varDropdownAnimTriggerHours, Text(Now(), "yyyymmddhhmmssfff"))
            Width: =15
            X: =Parent.Width - Self.Width - 15
            Y: =Parent.Height/2 - Self.Height/2
