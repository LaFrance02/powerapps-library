- conUserAvatar:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(59, 130, 246, 1)
      Height: =40
      RadiusBottomLeft: =20
      RadiusBottomRight: =20
      RadiusTopLeft: =20
      RadiusTopRight: =20
      Width: =40
      X: =40
      Y: =40
    Children:
      - lblUserAvatarInitials:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =13
            Text: =Upper(Left(User().FullName, 1) & Mid(User().FullName, Find(" ", User().FullName & " ") + 1, 1))
            Width: =Parent.Width
      - imgUserAvatarPhoto:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="Profile photo"
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Height: =Parent.Height
            Image: =User().Image
            ImagePosition: =ImagePosition.Fill
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Width: =Parent.Width
            X: =0
            Y: =0
      - conUserAvatarPresence:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(31, 41, 55, 1)
            BorderThickness: =2
            DropShadow: =DropShadow.None
            Fill: =RGBA(34, 197, 94, 1)
            Height: =12
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Width: =12
            X: =Parent.Width - 16
            Y: =Parent.Height - 16
