- conSkeletonCard:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =210
      Width: =280
      X: =40
      Y: =40
    Children:
      - SkeletonCardPulse:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =1400
            Height: =40
            Repeat: =true
            Visible: =false
            Width: =40
            X: =0
            Y: =0
      - conSkeletonCardImage:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(55, 65, 81, 0.35 + 0.45 * Sin(Pi() * SkeletonCardPulse.Value / SkeletonCardPulse.Duration))
            Height: =140
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =280
            X: =0
            Y: =0
      - conSkeletonCardTitle:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(55, 65, 81, 0.35 + 0.45 * Sin(Pi() * SkeletonCardPulse.Value / SkeletonCardPulse.Duration))
            Height: =14
            RadiusBottomLeft: =7
            RadiusBottomRight: =7
            RadiusTopLeft: =7
            RadiusTopRight: =7
            Width: =180
            X: =0
            Y: =156
      - conSkeletonCardLine1:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(55, 65, 81, 0.35 + 0.45 * Sin(Pi() * SkeletonCardPulse.Value / SkeletonCardPulse.Duration))
            Height: =10
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Width: =280
            X: =0
            Y: =182
      - conSkeletonCardLine2:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(55, 65, 81, 0.35 + 0.45 * Sin(Pi() * SkeletonCardPulse.Value / SkeletonCardPulse.Duration))
            Height: =10
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Width: =220
            X: =0
            Y: =200
