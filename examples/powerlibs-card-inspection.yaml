            X: =20
            Y: =20
          Children:
            - lblInspectionResultText:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Center
                  FontColor: =RGBA(239, 68, 68, 1)
                  Height: =Parent.Height
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: ="Failed"
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Semibold
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - lblInspectionDate:
          Control: Text@0.0.51
