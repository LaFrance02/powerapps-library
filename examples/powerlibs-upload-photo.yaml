- conPhotoUploadCard:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(75, 85, 99, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(31, 41, 55, 1)
      Height: =200
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =320
      X: =40
      Y: =40
    Children:
      - icoPhotoUploadIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(59, 130, 246, 1)
            Height: =36
            Icon: =Icon.Camera
            Visible: =IsBlank(btnPhotoUploadPicker.Media)
            Width: =36
            X: =Parent.Width / 2 - Self.Width / 2
            Y: =52
      - lblPhotoUploadCaption:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(209, 213, 219, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10
            Text: =If(IsBlank(btnPhotoUploadPicker.Media), "Tap to choose an image", "Tap to choose a different image")
            Width: =Parent.Width - 24
            X: =12
            Y: =If(IsBlank(btnPhotoUploadPicker.Media), 100, Parent.Height - 30)
      - lblPhotoUploadHint:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =18
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =8
            Text: ="PNG or JPG from your device"
            Visible: =IsBlank(btnPhotoUploadPicker.Media)
            Width: =Parent.Width - 24
            X: =12
            Y: =124
      - imgPhotoUploadPreview:
          Control: Image@2.2.3
          Properties:
            Height: =Parent.Height - 44
            Image: =btnPhotoUploadPicker.Media
            ImagePosition: =ImagePosition.Fit
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: =!IsBlank(btnPhotoUploadPicker.Media)
            Width: =Parent.Width - 24
            X: =12
            Y: =10
      - btnPhotoUploadPicker:
          Control: AddMedia@2.2.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height
            HoverBorderColor: =
            HoverFill: =
            PressedBorderColor: =
            PressedFill: =
            Text: =""
            UseMobileCamera: =false
            Width: =Parent.Width
            X: =0
            Y: =0
