- conDocumentUploadTinted:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(59, 130, 246, 0.4)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(59, 130, 246, 0.18)
      Height: =300
      RadiusBottomLeft: =16
      RadiusBottomRight: =16
      RadiusTopLeft: =16
      RadiusTopRight: =16
      Width: =360
      X: =40
      Y: =40
    Children:
      - icoDocumentUploadTintedIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(59, 130, 246, 1)
            Height: =36
            Icon: =Icon.DocumentWithContent
            Width: =36
            X: =Parent.Width / 2 - Self.Width / 2
            Y: =32
      - lblDocumentUploadTintedCaption:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(59, 130, 246, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =11
            Text: ="Drop your documents here"
            Width: =Parent.Width - 24
            X: =12
            Y: =78
      - lblDocumentUploadTintedHint:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(209, 213, 219, 1)
            Font: =Font.'Open Sans'
            Height: =18
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =8
            Text: ="or click Attach file. PDF, Word and Excel supported."
            Width: =Parent.Width - 24
            X: =12
            Y: =100
      - attDocumentUploadTintedPicker:
          Control: Attachments@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =RGBA(59, 130, 246, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            Height: =Parent.Height - 146
            HoverFill: =RGBA(59, 130, 246, 0.08)
            ItemColor: =RGBA(255, 255, 255, 1)
            ItemFill: =RGBA(59, 130, 246, 1)
            ItemHoverColor: =RGBA(255, 255, 255, 1)
            ItemHoverFill: =RGBA(59, 130, 246, 0.85)
            MaxAttachments: =10
            PaddingBottom: =5
            PaddingLeft: =5
            PaddingRight: =5
            PaddingTop: =5
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(59, 130, 246, 0.7)
            Size: =10
            Width: =Parent.Width - 32
            X: =16
            Y: =130
