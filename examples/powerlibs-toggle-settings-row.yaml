- conSettingRow:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =RGBA(34, 48, 74, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =RGBA(21, 30, 48, 1)
      Height: =68
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =Min(480, Parent.Width - 80)
      X: =40
      Y: =40
    Children:
      - lblSettingRowTitle:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(230, 234, 242, 1)
            Height: =24
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =15
            Text: ="Email notifications"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Semibold
            Width: =Parent.Width - 88
            X: =16
            Y: =14
      - lblSettingRowSub:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Start
            FontColor: =RGBA(139, 153, 176, 1)
            Height: =20
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: ="Get an email when a request needs your approval"
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Regular
            Width: =Parent.Width - 88
            X: =16
            Y: =34
      - imgSettingRowSwitch:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Height: =24
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 24' width='88' height='48'><g id='r" & Coalesce(varSettingRowRun, "0") & "'><rect width='44' height='24' rx='12' fill='" & If(Coalesce(varSettingRow, true), "#3B82F6", "#3C4B69") & "'><animate attributeName='fill' from='" & If(Coalesce(varSettingRow, true), "#3C4B69", "#3B82F6") & "' to='" & If(Coalesce(varSettingRow, true), "#3B82F6", "#3C4B69") & "' dur='" & If(IsBlank(varSettingRowRun), "1ms", "180ms") & "' fill='freeze'/></rect><circle cy='12' r='10' fill='white'><animate attributeName='cx' from='" & If(Coalesce(varSettingRow, true), "12", "32") & "' to='" & If(Coalesce(varSettingRow, true), "32", "12") & "' dur='" & If(IsBlank(varSettingRowRun), "1ms", "180ms") & "' fill='freeze' calcMode='spline' keySplines='0.2 0 0 1'/></circle></g></svg>")
            ImagePosition: =ImagePosition.Fit
            Width: =44
            X: =Parent.Width - 60
            Y: =(Parent.Height - 24) / 2
      - btnSettingRow:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: |-
              =UpdateContext({ varSettingRow: !Coalesce(varSettingRow, true), varSettingRowRun: Text(Now(), "yyyymmddhhmmssfff") })
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Text: =""
            Tooltip: ="Email notifications"
            Width: =Parent.Width
            X: =0
            Y: =0
