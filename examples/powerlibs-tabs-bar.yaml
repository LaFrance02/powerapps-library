- conTabBar:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =40
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      RadiusTopLeft: =0
      RadiusTopRight: =0
      Width: =Min(440, Parent.Width - 80)
      X: =40
      Y: =40
    Children:
      - conTabBarTrack:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(34, 48, 74, 1)
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =RGBA(11, 18, 32, 1)
            Height: =40
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.Width
            X: =0
            Y: =0
      - imgTabBarIndicator:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Height: =40
            Image: |-
              ="data:image/svg+xml," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 40' preserveAspectRatio='none'><g id='r" & Coalesce(varTabBarRun, "0") & "'><rect y='3' width='94' height='34' rx='7' fill='#151e30' stroke='rgba(0,0,0,0.06)'><animate attributeName='x' from='" & Text((Coalesce(varTabBarPrev, 1) - 1) * 100 + 3) & "' to='" & Text((Coalesce(varTabBar, 1) - 1) * 100 + 3) & "' dur='" & If(IsBlank(varTabBarRun), "1ms", "220ms") & "' fill='freeze' calcMode='spline' keySplines='0.2 0 0 1'/></rect></g></svg>")
            ImagePosition: =ImagePosition.Stretch
            Width: =Parent.Width
            X: =0
            Y: =0
      - btnTabBarTab1:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =If(Coalesce(varTabBar, 1) = 1, RGBA(230, 234, 242, 1), RGBA(139, 153, 176, 1))
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =If(Coalesce(varTabBar, 1) = 1, RGBA(230, 234, 242, 1), RGBA(230, 234, 242, 1))
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: |-
              =UpdateContext({ varTabBarPrev: Coalesce(varTabBar, 1), varTabBar: 1, varTabBarRun: Text(Now(), "yyyymmddhhmmssfff") })
            PaddingLeft: =4
            PaddingRight: =4
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(230, 234, 242, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: ="General"
            Width: =Parent.Width / 4
            X: =Parent.Width * 0 / 4
            Y: =0
      - btnTabBarTab2:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =If(Coalesce(varTabBar, 1) = 2, RGBA(230, 234, 242, 1), RGBA(139, 153, 176, 1))
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =If(Coalesce(varTabBar, 1) = 2, RGBA(230, 234, 242, 1), RGBA(230, 234, 242, 1))
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: |-
              =UpdateContext({ varTabBarPrev: Coalesce(varTabBar, 1), varTabBar: 2, varTabBarRun: Text(Now(), "yyyymmddhhmmssfff") })
            PaddingLeft: =4
            PaddingRight: =4
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(230, 234, 242, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: ="Address"
            Width: =Parent.Width / 4
            X: =Parent.Width * 1 / 4
            Y: =0
      - btnTabBarTab3:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =If(Coalesce(varTabBar, 1) = 3, RGBA(230, 234, 242, 1), RGBA(139, 153, 176, 1))
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =If(Coalesce(varTabBar, 1) = 3, RGBA(230, 234, 242, 1), RGBA(230, 234, 242, 1))
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: |-
              =UpdateContext({ varTabBarPrev: Coalesce(varTabBar, 1), varTabBar: 3, varTabBarRun: Text(Now(), "yyyymmddhhmmssfff") })
            PaddingLeft: =4
            PaddingRight: =4
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(230, 234, 242, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =11
            Text: ="Documents"
            Width: =Parent.Width / 4
            X: =Parent.Width * 2 / 4
            Y: =0
      - btnTabBarTab4:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =If(Coalesce(varTabBar, 1) = 4, RGBA(230, 234, 242, 1), RGBA(139, 153, 176, 1))
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =If(Coalesce(varTabBar, 1) = 4, RGBA(230, 234, 242, 1), RGBA(230, 234, 242, 1))
            HoverFill: =RGBA(0, 0, 0, 0)
            OnSelect: |-
              =UpdateContext({ varTabBarPrev: Coalesce(varTabBar, 1), varTabBar: 4, varTabBarRun: Text(Now(), "yyyymmddhhmmssfff") })
            PaddingLeft: =4
            PaddingRight: =4
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(230, 234, 242, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            RadiusBottomLeft: =8
