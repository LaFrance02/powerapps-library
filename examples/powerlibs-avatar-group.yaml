- conAvatarGroup:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =36
      Width: =132
      X: =40
      Y: =40
    Children:
      - conAvatarGroupItem1:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(31, 41, 55, 1)
            BorderThickness: =2
            DropShadow: =DropShadow.None
            Fill: =Switch(Mod(Len(User().FullName), 8), 0, RGBA(37, 99, 235, 1), 1, RGBA(124, 58, 237, 1), 2, RGBA(219, 39, 119, 1), 3, RGBA(220, 38, 38, 1), 4, RGBA(234, 88, 12, 1), 5, RGBA(5, 150, 105, 1), 6, RGBA(8, 145, 178, 1), RGBA(79, 70, 229, 1))
            Height: =36
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Width: =36
            X: =0
            Y: =0
          Children:
            - lblAvatarGroupInitials1:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.Height
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =Upper(Left(User().FullName, 1) & Mid(User().FullName, Find(" ", User().FullName & " ") + 1, 1))
                  Width: =Parent.Width
      - conAvatarGroupItem2:
