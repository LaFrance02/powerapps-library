- icoMenuKebab:
    Control: Classic/Icon@2.5.0
    Group: grpMenuPopover
    Properties:
      Color: =RGBA(156, 163, 175, 1)
      Height: =20
      HoverColor: =RGBA(229, 231, 235, 1)
      Icon: =Icon.More
      Width: =20
      X: =876
      Y: =323
- btnMenuTrigger:
    Control: Classic/Button@2.2.0
    Group: grpMenuPopover
    Properties:
      FocusedBorderThickness: =0
      BorderStyle: =BorderStyle.None
      Fill: =RGBA(0, 0, 0, 0)
      Height: =32
      HoverFill: =RGBA(55, 65, 81, 0.4)
      OnSelect: |-
        =UpdateContext({varMenuVisible: !varMenuVisible})
      PressedFill: =RGBA(75, 85, 99, 0.5)
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      RadiusTopLeft: =6
      RadiusTopRight: =6
      Text: =""
      Width: =32
      X: =870
      Y: =317
- conMenuOverlay:
    Control: Rectangle@2.3.0
    Group: grpMenuPopover
    Properties:
      Fill: =RGBA(0, 0, 0, 0)
      Height: =Parent.Height
      OnSelect: |-
        =UpdateContext({varMenuVisible: false})
      Visible: =varMenuVisible
      Width: =Parent.Width
- conMenuPopover:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Group: grpMenuPopover
    Properties:
      BorderColor: =RGBA(55, 65, 81, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.Regular
      Fill: =RGBA(31, 41, 55, 1)
      Height: =220
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Visible: =varMenuVisible
      Width: =200
      X: =910
      Y: =317
    Children:
      - galMenuItems:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height
            Items: |-
              =Table(
                {id: 1, text: "Edit", icon: Icon.Edit, isDivider: false, isDanger: false},
                {id: 2, text: "Duplicate", icon: Icon.Copy, isDivider: false, isDanger: false},
                {id: 3, text: "Share", icon: Icon.Share, isDivider: false, isDanger: false},
                {id: 4, text: "", icon: Blank(), isDivider: true, isDanger: false},
                {id: 5, text: "Delete", icon: Icon.Trash, isDivider: false, isDanger: true}
              )
            ShowScrollbar: =false
            TemplatePadding: =0
            TemplateSize: =44
            Width: =Parent.Width
          Children:
            - conMenuDivider:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(55, 65, 81, 1)
                  Height: =1
                  Visible: =ThisItem.isDivider
                  Width: =Parent.TemplateWidth - 16
                  X: =8
                  Y: =21
            - conMenuItem:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.TemplateHeight
                  Visible: =!ThisItem.isDivider
                  Width: =Parent.TemplateWidth
                Children:
                  - icoMenuItemIcon:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =If(ThisItem.isDanger, RGBA(239, 68, 68, 1), RGBA(156, 163, 175, 1))
                        Height: =16
                        Icon: =ThisItem.icon
                        Width: =16
                        X: =12
                        Y: =14
                  - lblMenuItemLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(ThisItem.isDanger, RGBA(239, 68, 68, 1), RGBA(229, 231, 235, 1))
                        Font: =Font.'Open Sans'
                        Size: =9
                        Text: =ThisItem.text
                        Width: =Parent.Width - 40
                        X: =36
                        Y: =4
            - btnMenuItemBtn:
                Control: Classic/Button@2.2.0
                Properties:
                  FocusedBorderThickness: =0
                  BorderStyle: =BorderStyle.None
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight
                  HoverFill: =If(ThisItem.isDanger, RGBA(254, 226, 226, 0.15), RGBA(55, 65, 81, 0.4))
                  OnSelect: |-
                    =UpdateContext({varMenuVisible: false})
                  PressedFill: =If(ThisItem.isDanger, RGBA(254, 202, 202, 0.15), RGBA(75, 85, 99, 0.6))
                  Text: =""
                  Visible: =!ThisItem.isDivider
                  Width: =Parent.TemplateWidth
