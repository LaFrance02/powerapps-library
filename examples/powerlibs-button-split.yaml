            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =1
            X: =80
            Y: =8
      - icoSplitChevron:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =18
            Icon: =If(varShowSplitMenu, Icon.ChevronUp, Icon.ChevronDown)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Width: =18
            X: =91
            Y: =11
      - btnSplitMain:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(255, 255, 255, 0.12)
            OnSelect: |-
              =// The main action, for example SubmitForm(frmEdit)
              false
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0.12)
            RadiusBottomLeft: =10
            RadiusBottomRight: =0
            RadiusTopLeft: =10
            RadiusTopRight: =0
            Text: =""
            Width: =80
            X: =0
            Y: =0
      - btnSplitToggle:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
