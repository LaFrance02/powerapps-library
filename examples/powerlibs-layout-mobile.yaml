                  - cntFabSlot:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =0
                        Height: =0
                        Width: =0
                      Children:
                        - lblFabPlaceholder:
                            Control: Text@0.0.51
