      Color: =RGBA(139, 153, 176, 1)
      FocusedBorderThickness: =0
      Height: =20
      Icon: =If(varShowNestedMenu, Icon.ChevronUp, Icon.ChevronDown)
      OnSelect: =Select(btnNestedMenu)
      PaddingBottom: =3
      PaddingLeft: =3
      PaddingRight: =3
      PaddingTop: =3
      Width: =20
      X: =btnNestedMenu.X + btnNestedMenu.Width - 30
      Y: =btnNestedMenu.Y + 10
